[advisories]
# Unmaintained crates default to `workspace`, which only inspects our own
# direct dependencies; almost everything we pull in is transitive, so the
# check was blind to the part of the tree we do not control.
unmaintained = "all"
yanked = "deny"

[licenses]
confidence-threshold = 0.8
allow = [
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "IJG",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]

[bans]
# `weezl` 0.1 and 0.2 are both present through independent current upstreams:
# tiff 0.11 (pdf-image-combine) and lopdf 0.44 (pdf-page-ops). Keep duplicate
# versions advisory until one of those owners converges; do not pin either
# transitive codec independently of its parser.
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
