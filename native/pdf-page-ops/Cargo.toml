[package]
name = "evb-pdf-page-ops"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
getrandom = "0.4.3"
evb-native-support = { version = "0.1.0", path = "../evb-native-support" }
lopdf = { version = "0.45.0", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value"] }
sha2 = "0.11"

harfrust = "0.13.3"
skrifa = { version = "0.46.2", default-features = false, features = ["std"] }
unicode-bidi = "0.3.18"
unicode-linebreak = "0.1.5"
unicode-segmentation = "1.12"
unicode-script = "0.5.8"
unicode-normalization = "0.1.25"
png = "0.18"
base64 = "0.23.1"
subsetter = { version = "0.2.6", default-features = false }

# Optimizing images reuses the image combiner's JPEG codec; the browser build
# has no optimizer and would also take the combiner's own WASM exports.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
evb-pdf-image-combine = { version = "0.1.0", path = "../pdf-image-combine" }

[target.'cfg(unix)'.dependencies]
libc.workspace = true
