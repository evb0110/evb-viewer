[workspace]
members = [
    "evb-native-support",
    "evb-raster-io",
    "jbig2-codec",
    "pdf-image-combine",
    "pdf-page-ops",
    "pdf-search",
    "scan-cleanup",
    "scan-primitives",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
rust-version = "1.89"

[workspace.dependencies]
libc = "0.2"
rayon = "1.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"

[profile.release]
codegen-units = 1
lto = "thin"
overflow-checks = true
panic = "unwind"
strip = "symbols"

[profile.test]
opt-level = 1
