packages:
  - '.'
  - 'landing'
  - 'packages/*'
  - 'scan-cleanup-core'

# Hold new registry releases for seven days before they can enter the lockfile.
# This applies to direct and transitive dependencies.
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  # Grandfather versions already present in the reviewed pre-update lockfile.
  - picomatch@4.0.7
  - prosemirror-view@1.42.3
  # Security fix for the qs advisories reported on 2026-09-02. Remove this
  # exception after qs@6.16.0 has aged past the seven-day release hold.
  - "@opentelemetry/core@2.11.0"
  - qs@6.16.0

# Release automation and Electron smoke need the real Electron binary on every
# fresh install. Electron 43 downloads lazily when required, so the root
# postinstall also runs check:electron:install. The allowlist is forward-
# compatible with Electron versions that restore a dependency lifecycle script
# and keeps strictDepBuilds from rejecting that script during an upgrade.
onlyBuiltDependencies:
  - electron
  - fallow
  - '@sentry/cli'

# These packages are intentionally safe to leave blocked in CI and fresh local
# installs. strictDepBuilds turns any new blocked build script into an install
# failure instead of a warning that can slip into a tagged release.
ignoredBuiltDependencies:
  - '@parcel/watcher'
  # electron-builder pulls this in for Windows packaging only; web installs and
  # general CI validation do not need its lifecycle scripts to run.
  - electron-winstaller
  - esbuild
  - unrs-resolver
  - vue-demi

strictDepBuilds: true
