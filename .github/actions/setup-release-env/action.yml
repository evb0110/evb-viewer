name: Setup release environment
description: >-
  Single owner for release and build runner provisioning: pnpm plus pinned
  Node, dependency install with retries, the Windows script shell and
  native-tool cache, MSYS2 for Windows ARM64 bundling, Rust targets, and
  per-OS system packages. Workflows that build or verify release artifacts
  use this action instead of copy-pasting provisioning steps, so a lane can
  no longer drift by missing one ambient dependency.

inputs:
  node-version:
    description: Exact Node version to install (workflows pass their pinned env.NODE_VERSION).
    required: true
  install-dependencies:
    description: Run scripts/ci-install-dependencies.mjs --frozen-lockfile and verify the Electron install.
    default: 'true'
  verify-electron:
    description: Verify the installed Electron executable after installing dependencies.
    default: 'true'
  windows-bundle-cache-key:
    description: >-
      Cache key prefix for the Windows native-tool archive cache (for example
      win-native-tools-x64). Empty skips the cache step. The bundling script
      verifies every archive against its SHA256 pin whether it comes from the
      cache or a fallback download.
    default: ''
  needs-msys2:
    description: Install MSYS2 (CLANGARM64) and export a verified MSYS2_ROOT for Windows ARM64 bundling.
    default: 'false'
  rust-targets:
    description: Space-separated rustup targets to add.
    default: ''
  apt-packages:
    description: Space-separated apt packages installed through scripts/ci/apt-install.sh (Linux only).
    default: ''
  pip-packages:
    description: Space-separated pinned pip packages (for example "Pillow==11.3.0").
    default: ''
  needs-playwright-chromium:
    description: Install Playwright Chromium with system dependencies.
    default: 'false'
  needs-system-fpm:
    description: >-
      Install system fpm for Linux electron-builder packaging.
      electron-builder's downloaded fpm binary is unreliable (x86-only on
      arm64, download failures on x64).
    default: 'false'
  brew-formulae:
    description: >-
      Space-separated Homebrew formulae (macOS only). When sphinx-doc is
      included its bin directory is appended to PATH for the doc-dependent
      native bundle scripts.
    default: ''

runs:
  using: composite
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5

    - name: Setup Node.js
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm
        cache-dependency-path: pnpm-lock.yaml

    # Windows: pnpm postinstall uses Unix commands (mkdir -p, cp) that
    # require bash. Configure pnpm to use Git Bash for lifecycle scripts.
    - name: Configure pnpm script shell (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: pnpm config set script-shell "C:\Program Files\Git\bin\bash.exe"

    - name: Cache Windows native tool archives
      if: runner.os == 'Windows' && inputs.windows-bundle-cache-key != ''
      # A cache-service failure falls through to pinned-checksum downloads
      # inside bundle-tools-windows.sh, which annotates every fallback.
      continue-on-error: true
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: ${{ runner.temp }}/win-bundle-cache
        key: ${{ inputs.windows-bundle-cache-key }}-${{ hashFiles('scripts/bundle-tools-windows.sh') }}
        # Bundler logic changes must not discard already verified archives for
        # the same platform and pinned tool versions. The script verifies
        # every restored archive before using it.
        restore-keys: |
          ${{ inputs.windows-bundle-cache-key }}-

    - name: Install dependencies
      if: inputs.install-dependencies == 'true'
      shell: bash
      run: node scripts/ci-install-dependencies.mjs --frozen-lockfile

    - name: Verify Electron install
      if: inputs.install-dependencies == 'true' && inputs.verify-electron == 'true'
      shell: bash
      run: pnpm run check:electron:install

    # Windows ARM64 images do not consistently include MSYS2. Install the
    # toolchain explicitly and publish its actual path for the Git Bash
    # bundler instead of depending on runner-image contents.
    - name: Setup MSYS2 for Windows ARM64 bundling
      if: inputs.needs-msys2 == 'true'
      id: setup-msys2
      uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2.32.0
      with:
        msystem: CLANGARM64
        update: false
        cache: true

    - name: Export and verify MSYS2 root
      if: inputs.needs-msys2 == 'true'
      shell: bash
      env:
        MSYS2_LOCATION: ${{ steps.setup-msys2.outputs.msys2-location }}
      run: |
        set -euo pipefail
        msys2_root="$(cygpath -u "$MSYS2_LOCATION")"
        echo "MSYS2_ROOT=$msys2_root" >> "$GITHUB_ENV"
        # Git Bash does not reliably expose the executable bit for native
        # Windows .exe files. Presence plus an actual invocation is the
        # portable fail-closed check for the installed MSYS2 tools.
        for tool in pacman.exe zstd.exe tar.exe; do
          tool_path="$msys2_root/usr/bin/$tool"
          if [ ! -f "$tool_path" ]; then
            echo "::error::MSYS2 ARM64 bundle tool not found at $tool_path"
            exit 1
          fi
          "$tool_path" --version
        done

    - name: Install Rust targets
      if: inputs.rust-targets != ''
      shell: bash
      run: rustup target add ${{ inputs.rust-targets }}

    - name: Build source-verified browser WASM artifacts
      if: inputs.rust-targets != '' && contains(inputs.rust-targets, 'wasm32-unknown-unknown')
      shell: bash
      run: |
        node scripts/build-wasm-artifacts.mjs --output-dir=.tmp/wasm-artifacts
        echo 'EVB_WASM_ARTIFACT_DIR=.tmp/wasm-artifacts' >> "$GITHUB_ENV"

    - name: Install apt packages
      if: runner.os == 'Linux' && inputs.apt-packages != ''
      shell: bash
      run: scripts/ci/apt-install.sh ${{ inputs.apt-packages }}

    - name: Install pinned pip packages
      if: inputs.pip-packages != ''
      shell: bash
      run: python3 -m pip install --disable-pip-version-check ${{ inputs.pip-packages }}

    - name: Install Playwright Chromium
      if: inputs.needs-playwright-chromium == 'true'
      shell: bash
      run: pnpm exec playwright install --with-deps chromium

    - name: Install system fpm (Linux)
      if: runner.os == 'Linux' && inputs.needs-system-fpm == 'true'
      shell: bash
      # Pin the gem so packaging tooling cannot drift under a release.
      run: |
        scripts/ci/apt-install.sh ruby-dev build-essential
        sudo gem install fpm -v 1.15.1

    - name: Install Homebrew formulae
      if: runner.os == 'macOS' && inputs.brew-formulae != ''
      shell: bash
      run: |
        brew install ${{ inputs.brew-formulae }}
        case " ${{ inputs.brew-formulae }} " in
          *' sphinx-doc '*)
            echo "$(brew --prefix sphinx-doc)/bin" >> "$GITHUB_PATH"
            ;;
        esac
