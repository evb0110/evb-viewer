name: Setup CI environment
description: Set up the pinned Node and pnpm toolchain and install the locked dependencies for CI.

inputs:
  node-version:
    description: Exact Node version to install.
    required: true
  cache-dependency-path:
    description: Lockfile path used by the pnpm cache.
    default: pnpm-lock.yaml
  wasm:
    description: Restore or build the browser WASM files in public/wasm.
    default: 'false'

runs:
  using: composite
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

    - name: Setup Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm
        cache-dependency-path: ${{ inputs.cache-dependency-path }}

    - name: Cache runtime binary archives
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .cache/runtime-binaries
        key: runtime-binaries-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/runtimeBinaryManifest.ts') }}

    - name: Install dependencies
      shell: bash
      run: node scripts/ci-install-dependencies.mjs --frozen-lockfile

    # Keyed on the native build IDs ensure-wasm-artifacts.mjs compares, so a
    # restored build is current exactly when the key matches. A hand-written
    # list of crates missed scan-cleanup, whose changes then restored a stale
    # build that the strict build rebuilt without the WASM target.
    - name: Identify browser WASM sources
      if: inputs.wasm == 'true'
      id: wasm-sources
      shell: bash
      run: |
        node --input-type=module -e "
          import {computeNativeBuildId} from './scripts/native-build-id.mjs';
          import {WASM_ARTIFACTS} from './scripts/wasm-artifacts.mjs';
          console.log('build-ids=' + WASM_ARTIFACTS.map(artifact => computeNativeBuildId(process.cwd(), artifact.crateName)).join('-'));
        " >> "$GITHUB_OUTPUT"

    - name: Restore browser WASM builds
      if: inputs.wasm == 'true'
      id: wasm-cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          public/wasm
          .tmp/wasm-build-ids.json
        key: wasm-v2-${{ runner.os }}-${{ steps.wasm-sources.outputs.build-ids }}-${{ hashFiles('scripts/build-wasm-tool.mjs', 'scripts/wasm-artifacts.mjs', 'scripts/lib/build-environment.mjs') }}

    - name: Build browser WASM
      if: inputs.wasm == 'true' && steps.wasm-cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        rustup target add wasm32-unknown-unknown
        node scripts/ensure-wasm-artifacts.mjs
