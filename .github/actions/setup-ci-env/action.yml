name: Setup CI environment
description: Set up the pinned Node and pnpm toolchain and install the locked dependencies for CI.

inputs:
  node-version:
    description: Exact Node version to install.
    required: true
  cache-dependency-path:
    description: Lockfile path used by the pnpm cache.
    default: pnpm-lock.yaml
  verify-electron:
    description: Verify the installed Electron executable after installing dependencies.
    default: 'false'
  wasm:
    description: Restore or build the browser WASM files in public/wasm.
    default: 'false'

runs:
  using: composite
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5

    - name: Setup Node.js
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm
        cache-dependency-path: ${{ inputs.cache-dependency-path }}

    - name: Cache runtime binary archives
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: .cache/runtime-binaries
        key: runtime-binaries-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/runtimeBinaryManifest.ts') }}

    - name: Install dependencies
      shell: bash
      run: node scripts/ci-install-dependencies.mjs --frozen-lockfile

    - name: Verify Electron install
      if: inputs.verify-electron == 'true'
      shell: bash
      run: pnpm run check:electron:install

    # Keyed on the crates the two WASM builds link (scripts/native-build-id.mjs
    # hashes the same closure to decide whether a restored build is current).
    - name: Restore browser WASM builds
      if: inputs.wasm == 'true'
      id: wasm-cache
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: |
          public/wasm
          .tmp/wasm-build-ids.json
        key: wasm-v1-${{ runner.os }}-${{ hashFiles('native/Cargo.toml', 'native/Cargo.lock', 'native/rust-toolchain.toml', 'native/pdf-page-ops/Cargo.toml', 'native/pdf-page-ops/src/**', 'native/pdf-image-combine/Cargo.toml', 'native/pdf-image-combine/src/**', 'native/evb-native-support/Cargo.toml', 'native/evb-native-support/src/**', 'native/evb-raster-io/Cargo.toml', 'native/evb-raster-io/src/**', 'native/jbig2-codec/Cargo.toml', 'native/jbig2-codec/src/**', 'native/scan-primitives/Cargo.toml', 'native/scan-primitives/src/**', 'scripts/build-wasm-tool.mjs', 'scripts/wasm-artifacts.mjs') }}

    - name: Build browser WASM
      if: inputs.wasm == 'true' && steps.wasm-cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        rustup target add wasm32-unknown-unknown
        node scripts/ensure-wasm-artifacts.mjs
