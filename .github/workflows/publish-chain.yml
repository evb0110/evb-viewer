name: Publish release chain

on:
  workflow_call:
    inputs:
      tag:
        description: Release tag whose staged assets are being published.
        required: true
        type: string
      workflow_sha:
        description: Trusted workflow revision containing the release helpers.
        required: true
        type: string
      artifact_name_prefix:
        description: Prefix used for the downloaded build artifacts.
        required: false
        default: dist-
        type: string
      drill:
        description: Verify the chain against a draft drill release without publishing it.
        required: false
        default: false
        type: boolean
      mirror_prefix:
        description: Optional release mirror prefix override.
        required: false
        default: ''
        type: string
      channel_key:
        description: Optional release mirror channel key override.
        required: false
        default: ''
        type: string
    outputs:
      released:
        description: Whether the release chain completed successfully.
        value: ${{ jobs.promote.outputs.released }}

permissions:
  contents: read

env:
  NODE_VERSION: '24.11.1'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  finalize:
    name: Finalize immutable release assets
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    permissions:
      attestations: write
      contents: write
      id-token: write

    steps:
      - name: Checkout trusted release helpers
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.workflow_sha }}
          persist-credentials: false

      - name: Setup release environment
        uses: ./.github/actions/setup-release-env
        with:
          node-version: ${{ env.NODE_VERSION }}
          install-dependencies: 'false'

      - name: Download staged release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: ${{ inputs.artifact_name_prefix }}*
          path: artifacts
          merge-multiple: true

      - name: Publish or verify immutable release checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
          DRILL: ${{ inputs.drill }}
        shell: bash
        run: |
          set -euo pipefail
          checksum_path='artifacts/SHA256SUMS'
          release_version="${RELEASE_TAG#v}"
          accepted_artifacts='accepted-artifacts'
          if release_json="$(gh release view "$RELEASE_TAG" --json assets 2>/dev/null)" \
            && jq -e '.assets[]? | select(.name == "SHA256SUMS")' >/dev/null <<< "$release_json"; then
            mkdir "$accepted_artifacts"
            gh release download "$RELEASE_TAG" --dir "$accepted_artifacts"
            node scripts/release/release-checksums.mjs verify "$accepted_artifacts" "$release_version"
            rm -rf artifacts
            mv "$accepted_artifacts" artifacts
          else
            node scripts/release/release-checksums.mjs generate artifacts
          fi
          node scripts/release/release-checksums.mjs verify artifacts "$release_version"
          if [ "$DRILL" = 'true' ]; then
            node scripts/release/ensure-github-release-assets.mjs "$RELEASE_TAG" "$checksum_path" --drill
          else
            node scripts/release/ensure-github-release-assets.mjs "$RELEASE_TAG" "$checksum_path"
          fi

      - name: Attest final release assets
        if: ${{ !inputs.drill }}
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: artifacts/*

  stage_mirror:
    name: Stage release mirror
    needs: finalize
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: release
    permissions:
      contents: write

    steps:
      - name: Checkout trusted release publisher
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.workflow_sha }}
          persist-credentials: false

      - name: Setup release environment
        uses: ./.github/actions/setup-release-env
        with:
          node-version: ${{ env.NODE_VERSION }}
          install-dependencies: 'false'

      - name: Install mirror publisher dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Download staged release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir artifacts
          gh release download "$RELEASE_TAG" --dir artifacts

      - name: Stage immutable mirror objects
        env:
          MIRROR_S3_ENDPOINT: ${{ secrets.MIRROR_S3_ENDPOINT }}
          MIRROR_S3_BUCKET: ${{ secrets.MIRROR_S3_BUCKET }}
          MIRROR_S3_ACCESS_KEY_ID: ${{ secrets.MIRROR_S3_ACCESS_KEY_ID }}
          MIRROR_S3_SECRET_KEY: ${{ secrets.MIRROR_S3_SECRET_KEY }}
          MIRROR_RELEASE_PREFIX: ${{ inputs.mirror_prefix }}
          MIRROR_CHANNEL_KEY: ${{ inputs.channel_key }}
          DRILL: ${{ inputs.drill }}
          RELEASE_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          args=(artifacts "$RELEASE_TAG" --stage)
          if [ "$DRILL" = 'true' ]; then
            args+=(--drill)
          fi
          node scripts/release/publish-release-mirror.mjs "${args[@]}"

  promote:
    name: Promote verified release
    needs: stage_mirror
    runs-on: ubuntu-latest
    # Mirror activation already bounds itself to three 600 s attempts with
    # 30 s pauses; the job budget has to cover that whole window.
    timeout-minutes: 40
    environment: release
    permissions:
      contents: write
    outputs:
      released: ${{ steps.result.outputs.released }}

    steps:
      - name: Checkout trusted release publisher
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.workflow_sha }}
          persist-credentials: false

      - name: Setup release environment
        uses: ./.github/actions/setup-release-env
        with:
          node-version: ${{ env.NODE_VERSION }}
          install-dependencies: 'false'

      - name: Install mirror publisher dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Download staged release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir artifacts
          gh release download "$RELEASE_TAG" --dir artifacts

      - name: Reconcile interrupted publication
        if: ${{ !inputs.drill }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
          MIRROR_S3_ENDPOINT: ${{ secrets.MIRROR_S3_ENDPOINT }}
          MIRROR_S3_BUCKET: ${{ secrets.MIRROR_S3_BUCKET }}
          MIRROR_S3_ACCESS_KEY_ID: ${{ secrets.MIRROR_S3_ACCESS_KEY_ID }}
          MIRROR_S3_SECRET_KEY: ${{ secrets.MIRROR_S3_SECRET_KEY }}
          MIRROR_RELEASE_PREFIX: ${{ inputs.mirror_prefix }}
          MIRROR_CHANNEL_KEY: ${{ inputs.channel_key }}
        shell: bash
        run: |
          set -euo pipefail
          state_file="$RUNNER_TEMP/release-state.json"
          gh release view "$RELEASE_TAG" --json tagName,isDraft,assets > "$state_file"
          set +e
          node scripts/release/publish-release-mirror.mjs reconcile "$RELEASE_TAG" "$state_file"
          reconciliation_status=$?
          set -e
          case "$reconciliation_status" in
            0)
              echo 'RELEASE_RECONCILED=true' >> "$GITHUB_ENV"
              ;;
            2)
              echo '::error::The previous publication is still a draft; its mirror channel was restored. Start a fresh publication attempt after reviewing the draft.'
              exit 1
              ;;
            4)
              ;;
            *)
              echo '::error::The previous publication transaction is unresolved; no mirror channel mutation was authorized.'
              exit 1
              ;;
          esac

      - name: Activate verified mirror channel
        if: ${{ env.RELEASE_RECONCILED != 'true' }}
        env:
          MIRROR_S3_ENDPOINT: ${{ secrets.MIRROR_S3_ENDPOINT }}
          MIRROR_S3_BUCKET: ${{ secrets.MIRROR_S3_BUCKET }}
          MIRROR_S3_ACCESS_KEY_ID: ${{ secrets.MIRROR_S3_ACCESS_KEY_ID }}
          MIRROR_S3_SECRET_KEY: ${{ secrets.MIRROR_S3_SECRET_KEY }}
          MIRROR_RELEASE_PREFIX: ${{ inputs.mirror_prefix }}
          MIRROR_CHANNEL_KEY: ${{ inputs.channel_key }}
          DRILL: ${{ inputs.drill }}
          RELEASE_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          args=(artifacts "$RELEASE_TAG" --transaction)
          if [ "$DRILL" = 'true' ]; then
            args+=(--drill)
          fi
          for attempt in 1 2 3; do
            if timeout 600s node scripts/release/publish-release-mirror.mjs "${args[@]}"; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo '::error::Mirror activation did not complete within the bounded reconciliation window; the publisher attempted rollback.'
              exit 1
            fi
            echo "Mirror activation attempt $attempt failed. Retrying in 30 seconds."
            sleep 30
          done

      - name: Promote verified GitHub draft
        if: ${{ !inputs.drill && env.RELEASE_RECONCILED != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
          MIRROR_S3_ENDPOINT: ${{ secrets.MIRROR_S3_ENDPOINT }}
          MIRROR_S3_BUCKET: ${{ secrets.MIRROR_S3_BUCKET }}
          MIRROR_S3_ACCESS_KEY_ID: ${{ secrets.MIRROR_S3_ACCESS_KEY_ID }}
          MIRROR_S3_SECRET_KEY: ${{ secrets.MIRROR_S3_SECRET_KEY }}
          MIRROR_RELEASE_PREFIX: ${{ inputs.mirror_prefix }}
          MIRROR_CHANNEL_KEY: ${{ inputs.channel_key }}
        shell: bash
        run: |
          set -euo pipefail
          promotion_error="$RUNNER_TEMP/release-promotion-error.txt"
          gh release edit "$RELEASE_TAG" --draft=false 2> "$promotion_error" || true
          release_state_error="$RUNNER_TEMP/release-promotion-state-error.txt"
          if ! gh release view "$RELEASE_TAG" --json tagName,isDraft,assets > "$RUNNER_TEMP/release-promotion-state.json" 2> "$release_state_error"; then
            echo "::error::GitHub promotion outcome is unresolved; authoritative release state could not be read."
            cat "$release_state_error"
            exit 1
          fi
          set +e
          node scripts/release/publish-release-mirror.mjs reconcile "$RELEASE_TAG" "$RUNNER_TEMP/release-promotion-state.json"
          reconciliation_status=$?
          set -e
          if [ "$reconciliation_status" -eq 0 ]; then
            exit 0
          fi
          cat "$promotion_error"
          if [ "$reconciliation_status" -eq 2 ]; then
            echo '::error::GitHub release remains a draft; the mirror channel was conditionally restored.'
          else
            echo '::error::GitHub promotion outcome is unresolved; the mirror channel was not changed.'
          fi
          exit 1

      - name: Assert drill release remains a draft
        if: ${{ inputs.drill }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          release_json="$(gh release view "$RELEASE_TAG" --json isDraft,assets)"
          if [ "$(jq -r '.isDraft' <<< "$release_json")" != 'true' ]; then
            echo '::error::Publish-chain drill release is not a draft.'
            exit 1
          fi
          remote_assets="$(jq -r '.assets[]?.name' <<< "$release_json")"
          if ! grep -Fqx 'SHA256SUMS' <<< "$remote_assets"; then
            echo '::error::Publish-chain drill release is missing SHA256SUMS.'
            exit 1
          fi
          while IFS= read -r local_asset; do
            asset_name="$(basename "$local_asset")"
            if ! grep -Fqx "$asset_name" <<< "$remote_assets"; then
              echo "::error::Publish-chain drill release is missing $asset_name."
              exit 1
            fi
          done < <(find artifacts -maxdepth 1 -type f -print | sort)

      - name: Record release result
        id: result
        if: ${{ always() }}
        env:
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          if [ "$JOB_STATUS" = 'success' ]; then
            echo 'released=true' >> "$GITHUB_OUTPUT"
          else
            echo 'released=false' >> "$GITHUB_OUTPUT"
          fi
