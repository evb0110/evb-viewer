name: Process safety platform acceptance

on:
  workflow_dispatch:
    inputs:
      acceptance:
        description: Focused acceptance selection for the platform runner
        required: false
        default: cli
        type: choice
        options:
          - cli
          - host-protocol
          - project8-fixture

permissions:
  contents: read

env:
  NODE_VERSION: 24.x

jobs:
  unix-cli:
    name: CLI process safety (${{ matrix.os }})
    if: ${{ inputs.acceptance == 'cli' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: node scripts/ci-install-dependencies.mjs --frozen-lockfile

      - name: Run CLI process-safety acceptance
        run: >-
          pnpm exec vitest run --project unit-scripts
          tests/unit/scripts/electronRunCliLegacyMigration.test.ts
          tests/unit/scripts/electronRunStopAllOwnership.test.ts
          tests/unit/scripts/electronRunTH2AutomaticPruning.test.ts

  windows-identity:
    name: Windows process identity representation
    if: ${{ inputs.acceptance == 'cli' }}
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: node scripts/ci-install-dependencies.mjs --frozen-lockfile

      - name: Run Windows identity acceptance
        run: >-
          pnpm exec vitest run --project unit-scripts
          tests/unit/scripts/electronRunProcessIdentity.test.ts
          -t "Windows controller|Windows process ancestry"

  host-protocol:
    name: Windows host protocol acceptance (macOS)
    if: ${{ inputs.acceptance == 'host-protocol' }}
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: node scripts/ci-install-dependencies.mjs --frozen-lockfile

      - name: Run focused Windows host protocol acceptance
        run: >-
          pnpm exec vitest run --project unit-tooling
          tests/unit/scripts/windows-test/hostLock.test.ts
          tests/unit/scripts/windows-test/hostLease.test.ts
          tests/unit/scripts/windows-test/hostCoordinator.test.ts
          tests/unit/scripts/windows-test/hostStopRun.test.ts

  project8-fixture:
    name: Project 8 process proof (${{ matrix.os }})
    if: ${{ inputs.acceptance == 'project8-fixture' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: node scripts/ci-install-dependencies.mjs --frozen-lockfile

      - name: Run Project 8 process proof fixture
        run: >-
          pnpm exec vitest run --project unit-electron
          tests/unit/electron/project8ProcessProofPlatform.test.ts
