name: Microsoft Store Package
run-name: Microsoft Store Package ${{ inputs.ref }}

# Manual only. The owner uploads the Store packages to Partner Center by hand,
# so this runs on request for a published release tag and nothing in the
# release chain waits for it. Download the result with
# `gh run download <run-id> --pattern 'store-appx-win-*'`.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Release tag or commit SHA to package (for example v1.2.3).
        required: true
        type: string
      sentry_environment:
        description: Closed Sentry build environment for this artifact.
        required: false
        default: production
        type: choice
        options:
          - production
          - test
      send_sentry_canaries:
        description: Send one test source-map canary for every private bundle after upload.
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  # Match the release build matrix so Store packages are built with the same
  # runtime as direct-download Windows installers.
  NODE_VERSION: '24.11.1'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: appx (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    env:
      EVB_RELEASE_TARGET_ARCH: ${{ matrix.arch }}
      EVB_RELEASE_TARGET_PLATFORM: win
      EVB_RELEASE_TARGET_DIST: store-appx-${{ matrix.arch }}
      EVB_SENTRY_TARGET: desktop
      EVB_SENTRY_ENVIRONMENT: ${{ inputs.sentry_environment }}
      SENTRY_DESKTOP_DSN: ${{ secrets.SENTRY_DESKTOP_DSN }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            arch: x64
          - os: windows-11-arm
            arch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ inputs.ref }}

      - name: Setup release environment
        uses: ./.github/actions/setup-release-env
        with:
          node-version: ${{ env.NODE_VERSION }}
          windows-bundle-cache-key: store-win-native-tools-${{ matrix.arch }}
          needs-msys2: ${{ matrix.arch == 'arm64' }}
          rust-targets: ${{ matrix.arch == 'arm64' && 'wasm32-unknown-unknown aarch64-pc-windows-msvc' || 'wasm32-unknown-unknown' }}

      - name: Resolve Sentry build identity
        shell: bash
        run: node scripts/release/resolve-sentry-build-identity.mjs --target=desktop

      - name: Bundle native tools
        shell: bash
        env:
          WIN_BUNDLE_CACHE_DIR: ${{ runner.temp }}/win-bundle-cache
        run: TARGET_ARCH=${{ matrix.arch }} bash scripts/bundle-tools-windows.sh

      - name: Build (Nuxt + Electron)
        env:
          EVB_NATIVE_TARGET_ARCH: ${{ matrix.arch }}
          EVB_NATIVE_TARGET_PLATFORM: win
        run: pnpm run build:strict

      - name: Upload strict build log on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: store-build-log-win-${{ matrix.arch }}-${{ github.run_attempt }}
          path: .tmp/build.log
          if-no-files-found: ignore

      - name: Package Microsoft Store AppX
        shell: bash
        run: |
          bash scripts/release/run-with-retries.sh 3 20 "Microsoft Store AppX packaging" \
            pnpm exec electron-builder --publish never --win appx --${{ matrix.arch }}

      - name: Verify Microsoft Store AppX
        shell: pwsh
        run: |
          $packages = @(Get-ChildItem -Path release -Filter "*-store.appx")
          if ($packages.Count -ne 1) {
            Write-Error "Expected exactly one Store .appx package, found $($packages.Count)."
            exit 1
          }

          $extractDir = Join-Path "${{ github.workspace }}" ".tmp\store-appx-${{ matrix.arch }}"
          Remove-Item -Recurse -Force $extractDir -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $extractDir | Out-Null
          # AppX is an OPC package: reserved characters such as '+' are
          # percent-encoded in raw ZIP entry names. MakeAppx decodes those
          # package URIs while unpacking, matching the filenames exposed to the
          # installed application and Windows DLL loader. tar.exe leaves the
          # encoded names on disk and produces false missing-DLL failures for
          # libc++.dll and libstdc++-6.dll.
          $makeAppxPath = (Get-Command makeappx.exe -ErrorAction SilentlyContinue).Source
          if (-not $makeAppxPath) {
            $sdkBinRoot = Join-Path "${env:ProgramFiles(x86)}" "Windows Kits\10\bin"
            $makeAppxPath = Get-ChildItem -Path $sdkBinRoot -Filter makeappx.exe -File -Recurse -ErrorAction Stop |
              Where-Object { $_.FullName -match '[\\/]x64[\\/]makeappx\.exe$' } |
              Sort-Object FullName -Descending |
              Select-Object -ExpandProperty FullName -First 1
          }
          if (-not $makeAppxPath) {
            Write-Error "MakeAppx is not installed or discoverable in the Windows SDK."
            exit 1
          }
          & $makeAppxPath unpack /o /p $packages[0].FullName /d $extractDir
          if ($LASTEXITCODE -ne 0) {
            Write-Error "MakeAppx failed to unpack the Store package."
            exit $LASTEXITCODE
          }

          $manifestPath = Join-Path $extractDir "AppxManifest.xml"
          if (-not (Test-Path $manifestPath)) {
            Write-Error "AppxManifest.xml is missing from the Store package."
            exit 1
          }

          $manifest = Get-Content -Raw $manifestPath
          $expectedManifestSnippets = @(
            'Name="EugeneBarsky.EVBViewer"',
            "Publisher='CN=06251AF5-66AF-420F-B896-574B507600B9'",
            '<DisplayName>EVB Viewer</DisplayName>',
            '<PublisherDisplayName>Eugene Barsky</PublisherDisplayName>',
            'Id="EVBViewer"',
            'Executable="app\EVB Viewer.exe"',
            'EntryPoint="Windows.FullTrustApplication"',
            'Name="runFullTrust"',
            '<Resource Language="en-US" />',
            '<Resource Language="ru-RU" />',
            '<Resource Language="fr-FR" />',
            '<Resource Language="de-DE" />',
            '<Resource Language="es-ES" />',
            '<Resource Language="it-IT" />',
            '<Resource Language="pt-PT" />',
            '<Resource Language="pt-BR" />',
            '<Resource Language="nl-NL" />'
          )

          foreach ($snippet in $expectedManifestSnippets) {
            if (-not $manifest.Contains($snippet)) {
              Write-Error "AppX manifest is missing expected snippet: $snippet"
              exit 1
            }
          }

          $expectedAssets = @(
            "StoreLogo.png",
            "Square44x44Logo.png",
            "Square150x150Logo.png",
            "Wide310x150Logo.png",
            "SmallTile.png",
            "LargeTile.png",
            "SplashScreen.png"
          )

          foreach ($asset in $expectedAssets) {
            $assetPath = Join-Path $extractDir "assets\$asset"
            if (-not (Test-Path $assetPath)) {
              Write-Error "Store package is missing asset: $asset"
              exit 1
            }
          }

          Write-Host "Verified Store package: $($packages[0].Name)"

      - name: Verify packaged native tools in Microsoft Store AppX
        shell: bash
        run: bash scripts/verify-packaged-native-tools.sh win "${{ matrix.arch }}" ".tmp/store-appx-${{ matrix.arch }}"

      - name: Verify packaged app contents in Microsoft Store AppX
        shell: bash
        run: node scripts/release/assert-packaged-app-contents.mjs ".tmp/store-appx-${{ matrix.arch }}"

      - name: Record Microsoft Store packaged-app provenance
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          node scripts/release/build-provenance.mjs create store "${{ matrix.arch }}" \
            ".tmp/store-appx-${{ matrix.arch }}/app/resources/app.asar" \
            "release/EVB-Viewer-${version}-store-${{ matrix.arch }}-provenance.json"

      - name: Check private Sentry upload readiness
        id: sentry_upload
        shell: bash
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_VERIFICATION_CONFIGURED: ${{ secrets.SENTRY_VERIFICATION_TOKEN != '' }}
          SENTRY_DESKTOP_DSN: ${{ secrets.SENTRY_DESKTOP_DSN }}
          SENTRY_DESKTOP_PROJECT: ${{ secrets.SENTRY_DESKTOP_PROJECT }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
        run: |
          set -euo pipefail
          configured=0
          for value in "$SENTRY_AUTH_TOKEN" "$SENTRY_DESKTOP_DSN" "$SENTRY_DESKTOP_PROJECT" "$SENTRY_ORG"; do
            if [ -n "$value" ]; then configured=$((configured + 1)); fi
          done
          if [ "$configured" -eq 4 ]; then
            if [ "${{ inputs.send_sentry_canaries }}" = 'true' ] && [ "$SENTRY_VERIFICATION_CONFIGURED" != 'true' ]; then
              echo '::error::SENTRY_VERIFICATION_TOKEN is required when source-map canaries are enabled.'
              exit 1
            fi
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          elif [ "$configured" -eq 0 ]; then
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo '::notice::Private Sentry upload is not configured; diagnostics remain disabled.'
          else
            echo '::error::Sentry diagnostics credentials are partially configured.'
            exit 1
          fi

      - name: Upload private Sentry source maps
        if: steps.sentry_upload.outputs.enabled == 'true'
        shell: bash
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_DESKTOP_PROJECT: ${{ secrets.SENTRY_DESKTOP_PROJECT }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
        run: node scripts/release/upload-sentry-sourcemaps.mjs

      - name: Verify packaged diagnostics consent and crash matrix
        shell: bash
        run: |
          if [ "${{ steps.sentry_upload.outputs.enabled }}" = 'true' ] && [ "${{ inputs.send_sentry_canaries }}" = 'true' ]; then
            EVB_SENTRY_RUNTIME_PROBE=packaged-smoke pnpm exec tsx \
              scripts/release/verifyPackagedDiagnosticsSmoke.ts -- \
              --executable ".tmp/store-appx-${{ matrix.arch }}/app/EVB Viewer.exe"
          else
            pnpm exec tsx scripts/release/verifyPackagedDiagnosticsSmoke.ts \
              --diagnostics-disabled -- \
              --executable ".tmp/store-appx-${{ matrix.arch }}/app/EVB Viewer.exe"
          fi

      - name: Send private Sentry source-map canaries
        if: steps.sentry_upload.outputs.enabled == 'true' && inputs.send_sentry_canaries
        shell: bash
        run: node scripts/release/send-sentry-sourcemap-canaries.mjs

      - name: Verify private Sentry source-map canaries
        if: steps.sentry_upload.outputs.enabled == 'true' && inputs.send_sentry_canaries
        shell: bash
        env:
          SENTRY_VERIFICATION_TOKEN: ${{ secrets.SENTRY_VERIFICATION_TOKEN }}
          SENTRY_DESKTOP_PROJECT: ${{ secrets.SENTRY_DESKTOP_PROJECT }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
        run: node scripts/release/verify-sentry-sourcemap-canaries.mjs

      - name: Upload Sentry source-map verification receipt
        if: ${{ always() && steps.sentry_upload.outputs.enabled == 'true' && inputs.send_sentry_canaries }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sentry-sourcemap-verification-store-${{ matrix.arch }}
          path: .tmp/private-sourcemaps/**/canary-verification-receipt.json
          if-no-files-found: error

      - name: Upload Microsoft Store AppX
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: store-appx-win-${{ matrix.arch }}
          path: |
            release/*-store.appx
            release/*-store-*-provenance.json
          if-no-files-found: error

  installed_smoke:
    name: installed smoke (Windows 11 ARM64, ${{ matrix.arch }})
    # windows-2022 is a Windows Server image and cannot load the Appx
    # deployment module used by Add-AppxPackage. Windows 11 ARM is a desktop
    # image and can install the ARM64 package natively and the x64 package via
    # Windows on Arm x64 emulation.
    needs: build
    runs-on: windows-11-arm
    strategy:
      fail-fast: false
      matrix:
        arch:
          - x64
          - arm64

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ inputs.ref }}

      - name: Setup release environment
        uses: ./.github/actions/setup-release-env
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download Store AppX artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: store-appx-win-${{ matrix.arch }}
          path: store-artifacts/store-appx-win-${{ matrix.arch }}

      - name: Install and launch Microsoft Store AppX smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $packageDirectory = Join-Path "${{ github.workspace }}" "store-artifacts\store-appx-win-${{ matrix.arch }}"
          $packages = @(Get-ChildItem -Path $packageDirectory -Filter "*-store.appx" -File)
          if ($packages.Count -ne 1) {
            throw "Expected exactly one Store .appx package for ${{ matrix.arch }}, found $($packages.Count)."
          }

          # Partner Center signs Store packages on submission, so the built
          # .appx is unsigned and Add-AppxPackage rejects it (0x800B0100).
          # Sign a runner-local copy with a throwaway certificate whose subject
          # equals the manifest publisher and trust it for this job only.
          $signToolPath = (Get-Command signtool.exe -ErrorAction SilentlyContinue).Source
          if (-not $signToolPath) {
            $sdkBinRoot = Join-Path "${env:ProgramFiles(x86)}" "Windows Kits\10\bin"
            $signToolPath = Get-ChildItem -Path $sdkBinRoot -Filter signtool.exe -File -Recurse -ErrorAction Stop |
              Where-Object { $_.FullName -match '[\\/]x64[\\/]signtool\.exe$' } |
              Sort-Object FullName -Descending |
              Select-Object -ExpandProperty FullName -First 1
          }
          if (-not $signToolPath) {
            throw "SignTool is not installed or discoverable in the Windows SDK."
          }

          $publisher = 'CN=06251AF5-66AF-420F-B896-574B507600B9'
          $certificateParameters = @{
            Type = 'Custom'
            Subject = $publisher
            KeyUsage = 'DigitalSignature'
            KeyAlgorithm = 'RSA'
            KeyLength = 2048
            NotAfter = (Get-Date).AddDays(1)
            CertStoreLocation = 'Cert:\CurrentUser\My'
            TextExtension = @('2.5.29.37={text}1.3.6.1.5.5.7.3.3', '2.5.29.19={text}')
          }
          $certificate = New-SelfSignedCertificate @certificateParameters
          $pfxPassword = [guid]::NewGuid().ToString()
          $pfxPath = Join-Path $env:RUNNER_TEMP 'store-appx-smoke.pfx'
          $cerPath = Join-Path $env:RUNNER_TEMP 'store-appx-smoke.cer'
          Export-PfxCertificate -Cert $certificate -FilePath $pfxPath -Password (ConvertTo-SecureString $pfxPassword -AsPlainText -Force) | Out-Null
          Export-Certificate -Cert $certificate -FilePath $cerPath | Out-Null
          Import-Certificate -FilePath $cerPath -CertStoreLocation 'Cert:\LocalMachine\TrustedPeople' | Out-Null

          $packagePath = Join-Path $env:RUNNER_TEMP $packages[0].Name
          Copy-Item -Path $packages[0].FullName -Destination $packagePath -Force
          & $signToolPath sign /fd SHA256 /f $pfxPath /p $pfxPassword $packagePath
          if ($LASTEXITCODE -ne 0) {
            throw "SignTool failed to sign the Store package copy with exit code $LASTEXITCODE."
          }

          Add-AppxPackage -Path $packagePath -ForceApplicationShutdown
          $installedExecutable = $null
          try {
            $package = Get-AppxPackage -Name 'EugeneBarsky.EVBViewer' -ErrorAction Stop
            $installedExecutable = Join-Path $package.InstallLocation 'app\EVB Viewer.exe'
            if (-not (Test-Path $installedExecutable -PathType Leaf)) {
              throw "Installed Store package executable is missing: $installedExecutable"
            }

            $appUserModelId = "$($package.PackageFamilyName)!EVBViewer"
            Start-Process -FilePath "shell:AppsFolder\$appUserModelId" | Out-Null
            $launchDeadline = (Get-Date).AddMinutes(2)
            $launchedProcess = $null
            while (-not $launchedProcess -and (Get-Date) -lt $launchDeadline) {
              Start-Sleep -Seconds 2
              $launchedProcess = Get-CimInstance Win32_Process -ErrorAction SilentlyContinue |
                Where-Object { $_.ExecutablePath -eq $installedExecutable } |
                Select-Object -First 1
            }
            if (-not $launchedProcess) {
              throw "Store AppX launch did not start $installedExecutable before the deadline."
            }
            Stop-Process -Id $launchedProcess.ProcessId -Force -ErrorAction SilentlyContinue
            pnpm run test:packaged-core-pdf-smoke -- --executable $installedExecutable
            if ($LASTEXITCODE -ne 0) {
              throw "Installed Store AppX core-PDF smoke failed with exit code $LASTEXITCODE."
            }
          } finally {
            if ($installedExecutable) {
              Get-CimInstance Win32_Process -ErrorAction SilentlyContinue |
                Where-Object { $_.ExecutablePath -eq $installedExecutable } |
                ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue }
            }
            $installed = Get-AppxPackage -Name 'EugeneBarsky.EVBViewer' -ErrorAction SilentlyContinue
            if ($installed) {
              Remove-AppxPackage -Package $installed.PackageFullName -ErrorAction Stop
            }
            Remove-Item -Path "Cert:\LocalMachine\TrustedPeople\$($certificate.Thumbprint)" -ErrorAction SilentlyContinue
            Remove-Item -Path "Cert:\CurrentUser\My\$($certificate.Thumbprint)" -ErrorAction SilentlyContinue
          }
