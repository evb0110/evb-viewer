name: CI Nightly

# The nightly run: checks whose value does not depend on which commit runs
# them. They are slow, they need large fixtures or a second platform, or they
# measure wall-clock budgets that a shared hosted runner cannot hold steady.
# One macOS build job feeds all ten macOS E2E jobs.
# It reports; nothing here gates a commit or a release (ci.yml's gates_ok is
# the one required verdict).
#
# Nightly execution certifies nothing about a release. The release path runs
# its own five-target packaging and packaged verification for the exact target
# SHA in release.yml; the jobs here are early warning, not release evidence.
#
# The exact-fixture lane runs only where its private fixture lives. Hosted
# large-PDF and visible-window lanes use generated fixtures and run nightly.

concurrency:
  group: ci-nightly-${{ github.ref_name }}
  cancel-in-progress: false

on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

env:
  NODE_VERSION: '24.11.1'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  EVB_E2E_PRESERVE_ARTIFACTS: '1'

jobs:
  release_mirror_health:
    name: Public release mirror health
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: main

      - name: Setup CI environment
        uses: ./.github/actions/setup-ci-env
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Check latest public release and updater mirror
        run: node --import tsx scripts/release/verifyReleaseMirror.mjs --latest

  nightly_scan_cleanup_heavy:
    name: Scan Cleanup Heavy Gates
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup CI environment
        uses: ./.github/actions/setup-ci-env
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install PDF text test tools
        timeout-minutes: 15
        run: scripts/ci/apt-install.sh poppler-utils

      - name: Restore Rust build caches
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/target
          key: rust-scan-heavy-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('native/Cargo.lock', 'rust-toolchain.toml', 'native/rust-toolchain.toml') }}
          restore-keys: rust-scan-heavy-${{ runner.os }}-${{ runner.arch }}-

      - name: Canonical scan-cleanup identity
        run: pnpm run test:scan-cleanup:canonical-identity

  # The second architecture for the Rust workspace. The x64 run in ci.yml
  # catches a logic regression on the push that caused it; this
  # one exists for the architecture-specific failure, which no commit predicts.
  nightly_rust_tests_arm64:
    name: Rust Tests (Linux arm64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup CI environment
        uses: ./.github/actions/setup-ci-env
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install PDF test tools
        timeout-minutes: 15
        run: scripts/ci/apt-install.sh poppler-utils qpdf

      - name: Restore Rust build caches
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/target
          key: rust-arm64-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('native/Cargo.lock', 'rust-toolchain.toml', 'native/rust-toolchain.toml') }}
          restore-keys: rust-arm64-${{ runner.os }}-${{ runner.arch }}-

      - name: Rust tests
        run: pnpm run test:rust

  nightly_rust_fuzz:
    name: Native Parser Fuzz Canaries
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Pinned so the cached fuzz builds stay valid; a floating nightly
      # changes daily and would miss the cache on every scheduled run.
      FUZZ_TOOLCHAIN: nightly-2026-09-27

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install nightly toolchain
        run: rustup toolchain install "$FUZZ_TOOLCHAIN" --profile minimal

      - name: Restore cargo-fuzz
        id: cargo-fuzz-cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cargo/bin/cargo-fuzz
          key: cargo-fuzz-v1-${{ runner.os }}-${{ runner.arch }}-0.13.1

      - name: Restore fuzz target builds
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            native/pdf-image-combine/fuzz/target
            native/pdf-page-ops/fuzz/target
            native/jbig2-codec/fuzz/target
          key: native-fuzz-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.FUZZ_TOOLCHAIN }}-${{ hashFiles('native/Cargo.lock', 'native/pdf-image-combine/fuzz/Cargo.toml', 'native/pdf-image-combine/fuzz/Cargo.lock', 'native/pdf-page-ops/fuzz/Cargo.toml', 'native/pdf-page-ops/fuzz/Cargo.lock', 'native/jbig2-codec/fuzz/Cargo.toml', 'native/jbig2-codec/fuzz/Cargo.lock') }}

      - name: Install cargo-fuzz
        if: steps.cargo-fuzz-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-fuzz --version 0.13.1 --locked

      - name: Fuzz image decoders
        run: |
          for target in png jpeg tiff netpbm; do
            cargo "+$FUZZ_TOOLCHAIN" fuzz run "$target" --fuzz-dir native/pdf-image-combine/fuzz -- -max_total_time=15
          done

      - name: Fuzz xref parsers
        run: |
          for target in xref-table xref-stream; do
            cargo "+$FUZZ_TOOLCHAIN" fuzz run "$target" --fuzz-dir native/pdf-page-ops/fuzz -- -max_total_time=15
          done

      - name: Fuzz JBIG2 codec
        run: |
          for target in decode roundtrip; do
            cargo "+$FUZZ_TOOLCHAIN" fuzz run "$target" --fuzz-dir native/jbig2-codec/fuzz -- -max_total_time=15
          done

  electron_e2e_macos_build:
    name: Electron E2E macOS Build
    runs-on: macos-14
    timeout-minutes: 30
    outputs:
      lanes: ${{ steps.lanes.outputs.lanes }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup CI environment
        uses: ./.github/actions/setup-ci-env
        with:
          node-version: ${{ env.NODE_VERSION }}
          wasm: 'true'

      - name: Restore staged Electron native binaries
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            .tmp/scan-cleanup
            .tmp/pdf-image-combine
            .tmp/pdf-page-ops
            .tmp/pdf-search
          key: electron-native-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('native/**', 'packages/contracts/**', 'scripts/build-native-tool.mjs', 'scripts/native-build-id.mjs', 'scripts/cargo-artifacts.mjs', 'scripts/nativeResourceManifest.ts', 'scripts/native-rust-targets.mjs', 'native/rust-toolchain.toml', 'rust-toolchain.toml', 'public/fonts/annotation/**', 'pnpm-lock.yaml') }}
          restore-keys: |
            electron-native-v2-${{ runner.os }}-${{ runner.arch }}-

      - name: Build renderer, Electron and native tools
        run: pnpm run build && pnpm run build:electron && pnpm run build:native:e2e

      - name: List lanes
        id: lanes
        run: node scripts/electron-e2e-lanes.mjs >> "$GITHUB_OUTPUT"

      # A tarball keeps the native tools executable.
      - name: Pack build
        run: tar -cf electron-e2e-build.tar nuxt-output/public dist-electron .tmp/scan-cleanup .tmp/pdf-image-combine .tmp/pdf-page-ops .tmp/pdf-search

      - name: Upload build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: electron-e2e-macos-build
          retention-days: 1
          path: electron-e2e-build.tar

  # The per-push Electron E2E lanes again on macOS, the owner's platform, with
  # wall-clock budgets enforced. ci.yml runs the same lanes on Linux and only
  # reports a missed budget.
  nightly_electron_e2e_macos:
    name: Electron E2E macOS (${{ matrix.lane }})
    needs: electron_e2e_macos_build
    runs-on: macos-14
    timeout-minutes: 60
    env:
      EVB_E2E_TIMING_BUDGETS: enforce
    strategy:
      fail-fast: false
      matrix:
        lane: ${{ fromJSON(needs.electron_e2e_macos_build.outputs.lanes) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup CI environment
        uses: ./.github/actions/setup-ci-env
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: electron-e2e-macos-build

      - name: Unpack build
        run: tar -xf electron-e2e-build.tar && rm electron-e2e-build.tar

      - name: Fetch pinned native tools
        run: node --import tsx scripts/fetchRuntimeBinaries.ts --target darwin-arm64

      - name: Install PDF test tools
        # The interop checks validate and render saved PDFs with independent
        # qpdf and Poppler, as ci.yml installs them on Linux.
        run: brew install imagemagick poppler qpdf

      - name: Install Playwright Chromium
        # annotationStrokeParity compares Electron with standalone Chromium.
        if: ${{ matrix.lane == 'e2e-drawing' }}
        run: pnpm exec playwright install chromium

      - name: Electron E2E ${{ matrix.lane }}
        run: bash scripts/test-electron-e2e-headless.sh --no-build "${{ matrix.lane }}" --reporter verbose

      - name: Upload Electron E2E artifacts
        if: ${{ always() }}
        uses: ./.github/actions/upload-electron-e2e-artifacts
        with:
          artifact-name: electron-macos-${{ matrix.lane }}-${{ github.run_attempt }}

  # High-zoom search over a generated large document with its own apply budget.
  nightly_electron_e2e_search_match_scroll:
    name: Electron E2E Search Match Scroll
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EVB_E2E_TIMING_BUDGETS: enforce

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup CI environment
        uses: ./.github/actions/setup-ci-env
        with:
          node-version: ${{ env.NODE_VERSION }}
          wasm: 'true'

      - name: Electron E2E search match scroll
        run: pnpm run test:e2e e2e-search --reporter verbose

      - name: Upload Electron E2E artifacts
        if: ${{ always() }}
        uses: ./.github/actions/upload-electron-e2e-artifacts
        with:
          artifact-name: electron-search-match-scroll-${{ github.run_attempt }}

  nightly_electron_e2e_large_pdf:
    name: Electron E2E Large PDF
    needs: electron_e2e_macos_build
    runs-on: macos-14
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup CI environment
        uses: ./.github/actions/setup-ci-env
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: electron-e2e-macos-build

      - name: Unpack build
        run: tar -xf electron-e2e-build.tar && rm electron-e2e-build.tar

      - name: Electron E2E large PDF
        env:
          EVB_E2E_REQUIRE_LARGE_PDF_FIXTURE: '1'
        run: bash scripts/test-electron-e2e-headless.sh --no-build e2e-large-pdf --reporter verbose

      - name: Upload Electron E2E artifacts
        if: ${{ always() }}
        uses: ./.github/actions/upload-electron-e2e-artifacts
        with:
          artifact-name: electron-large-pdf-${{ github.run_attempt }}

  nightly_electron_e2e_visible_window:
    name: Electron E2E Visible Window
    needs: electron_e2e_macos_build
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup CI environment
        uses: ./.github/actions/setup-ci-env
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: electron-e2e-macos-build

      - name: Unpack build
        run: tar -xf electron-e2e-build.tar && rm electron-e2e-build.tar

      - name: Electron E2E visible-window lifecycle
        run: pnpm exec vitest run --project e2e-visible-window --reporter verbose

      - name: Upload Electron E2E artifacts
        if: ${{ always() }}
        uses: ./.github/actions/upload-electron-e2e-artifacts
        with:
          artifact-name: electron-visible-window-${{ github.run_attempt }}

  # A scheduled red nobody sees is no check at all: every scheduled run keeps
  # one ci-nightly-failure issue open while any job fails and closes it on
  # the first fully green run.
  report:
    name: Report nightly result
    needs:
      - release_mirror_health
      - nightly_scan_cleanup_heavy
      - nightly_rust_tests_arm64
      - nightly_rust_fuzz
      - electron_e2e_macos_build
      - nightly_electron_e2e_macos
      - nightly_electron_e2e_search_match_scroll
      - nightly_electron_e2e_large_pdf
      - nightly_electron_e2e_visible_window
    if: ${{ always() && github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write

    steps:
      - name: Update the ci-nightly-failure issue
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          NEEDS: ${{ toJSON(needs) }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          label='ci-nightly-failure'
          failed="$(jq -r 'to_entries[] | select(.value.result != "success" and .value.result != "skipped") | "- \(.key): \(.value.result)"' <<<"$NEEDS")"
          if ! gh label list --limit 200 --json name --jq '.[].name' | grep -Fxq "$label"; then
            gh label create "$label" --color E11D48 --description 'Scheduled CI Nightly failures'
          fi
          issue="$(gh issue list --label "$label" --state open --limit 1 --json number --jq '.[0].number // empty')"
          if [ -z "$failed" ]; then
            if [ -n "$issue" ]; then
              gh issue close "$issue" --comment "CI Nightly is green again on $SHA. Run: $RUN_URL"
            fi
            exit 0
          fi
          body="$(printf 'CI Nightly failed on %s.\n\n%s\n\nRun: %s\n' "$SHA" "$failed" "$RUN_URL")"
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --body "$body"
          else
            gh issue create --title 'CI Nightly is failing' --label "$label" --body "$body"
          fi
