name: CI Nightly

# The nightly run: checks whose value does not depend on which commit runs
# them. They are slow, they need large fixtures or a second platform, or they
# measure wall-clock budgets that a shared hosted runner cannot hold steady.
# It reports; nothing here gates a commit or a release (ci.yml's gates_ok is
# the one required verdict).
#
# Nightly execution certifies nothing about a release. The release path runs
# its own five-target packaging and packaged verification for the exact target
# SHA in release.yml; the jobs here are early warning, not release evidence.
#
# The manual lanes need a local fixture profile or a visible window, so they
# stay on workflow_dispatch: a scheduled red from a missing fixture
# would teach everyone to ignore this workflow.

concurrency:
  group: ci-nightly-${{ github.ref_name }}
  cancel-in-progress: false

on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

env:
  NODE_VERSION: '24.11.1'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  EVB_E2E_PRESERVE_ARTIFACTS: '1'

jobs:
  release_mirror_health:
    name: Public release mirror health
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: main

      - name: Setup CI environment
        id: setup
        uses: ./.github/actions/setup-ci-env
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Check latest public release and updater mirror
        id: mirror_check
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: node --import tsx scripts/release/verifyReleaseMirror.mjs --latest

      - name: Report through the release-mirror-health issue
        if: ${{ always() && steps.setup.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          CHECK_OUTCOME: ${{ steps.mirror_check.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          label='release-mirror-health'
          if ! gh label list --json name --jq '.[].name' | grep -Fxq "$label"; then
            gh label create "$label" --color E11D48 --description 'Public release mirror health failures'
          fi
          issue_number="$(gh issue list --label "$label" --state open --limit 1 --json number --jq '.[0].number // empty')"

          if [ "$CHECK_OUTCOME" = 'success' ]; then
            if [ -n "$issue_number" ]; then
              gh issue close "$issue_number" --comment "$(printf 'The current GitHub release and updater mirror agree and serve a release asset again.\n\nRun: %s' "$RUN_URL")"
            fi
            exit 0
          fi

          latest_tag="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name 2>/dev/null || echo unavailable)"
          body="$(printf '%s\n' \
            "The public release mirror health check failed for latest release $latest_tag." \
            "The GitHub latest release, updater channel, release manifest, and served asset must name the same tag." \
            "Run: $RUN_URL")"
          if [ -n "$issue_number" ]; then
            gh issue comment "$issue_number" --body "$body"
          else
            gh issue create --title 'Public release mirror health check failed' --label "$label" --body "$body"
          fi
          exit 1

  nightly_scan_cleanup_heavy:
    name: Scan Cleanup Heavy Gates
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup CI environment
        uses: ./.github/actions/setup-ci-env
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install PDF text test tools
        timeout-minutes: 15
        run: scripts/ci/apt-install.sh poppler-utils

      - name: Restore Rust build caches
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/target
          key: rust-scan-heavy-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('native/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: rust-scan-heavy-${{ runner.os }}-${{ runner.arch }}-

      - name: Canonical scan-cleanup identity
        run: pnpm run test:scan-cleanup:canonical-identity

  # The second architecture for the Rust workspace. The x64 run in ci.yml
  # catches a logic regression on the push that caused it; this
  # one exists for the architecture-specific failure, which no commit predicts.
  nightly_rust_tests_arm64:
    name: Rust Tests (Linux arm64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup CI environment
        uses: ./.github/actions/setup-ci-env
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install PDF test tools
        timeout-minutes: 15
        run: scripts/ci/apt-install.sh poppler-utils qpdf

      - name: Restore Rust build caches
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/target
          key: rust-arm64-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('native/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: rust-arm64-${{ runner.os }}-${{ runner.arch }}-

      - name: Rust tests
        run: pnpm run test:rust

  nightly_rust_fuzz:
    name: Native Parser Fuzz Canaries
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install cargo-fuzz
        run: |
          rustup toolchain install nightly --profile minimal
          cargo install cargo-fuzz --version 0.13.1 --locked

      - name: Fuzz image decoders
        run: |
          for target in png jpeg tiff netpbm; do
            cargo +nightly fuzz run "$target" --fuzz-dir native/pdf-image-combine/fuzz -- -max_total_time=15
          done

      - name: Fuzz xref parsers
        run: |
          for target in xref-table xref-stream; do
            cargo +nightly fuzz run "$target" --fuzz-dir native/pdf-page-ops/fuzz -- -max_total_time=15
          done

      - name: Fuzz JBIG2 codec
        run: |
          for target in decode roundtrip; do
            cargo +nightly fuzz run "$target" --fuzz-dir native/jbig2-codec/fuzz -- -max_total_time=15
          done

  electron_e2e_lanes:
    name: Electron E2E Lanes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      lanes: ${{ steps.lanes.outputs.lanes }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: List lanes
        id: lanes
        run: node scripts/electron-e2e-lanes.mjs >> "$GITHUB_OUTPUT"

  # The per-push Electron E2E lanes again on macOS, the owner's platform, with
  # wall-clock budgets enforced. ci.yml runs the same lanes on Linux and only
  # reports a missed budget.
  nightly_electron_e2e_macos:
    name: Electron E2E macOS (${{ matrix.lane }})
    needs: electron_e2e_lanes
    runs-on: macos-14
    timeout-minutes: 60
    env:
      EVB_E2E_TIMING_BUDGETS: enforce
    strategy:
      fail-fast: false
      matrix:
        lane: ${{ fromJSON(needs.electron_e2e_lanes.outputs.lanes) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup CI environment
        uses: ./.github/actions/setup-ci-env
        with:
          node-version: ${{ env.NODE_VERSION }}
          verify-electron: 'true'
          wasm: 'true'

      - name: Fetch pinned native tools
        run: node --import tsx scripts/fetchRuntimeBinaries.ts --target darwin-arm64

      - name: Install PDF test tools
        run: brew install imagemagick

      - name: Install Playwright Chromium
        # annotationStrokeParity compares Electron with standalone Chromium.
        if: ${{ matrix.lane == 'e2e-drawing' }}
        run: pnpm exec playwright install chromium

      - name: Electron E2E ${{ matrix.lane }}
        run: pnpm run test:e2e "${{ matrix.lane }}" --reporter verbose

      - name: Upload Electron E2E artifacts
        if: ${{ always() }}
        uses: ./.github/actions/upload-electron-e2e-artifacts
        with:
          artifact-name: electron-macos-${{ matrix.lane }}-${{ github.run_attempt }}

  # High-zoom search over a generated large document with its own apply budget.
  nightly_electron_e2e_search_match_scroll:
    name: Electron E2E Search Match Scroll
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EVB_E2E_TIMING_BUDGETS: enforce

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup CI environment
        uses: ./.github/actions/setup-ci-env
        with:
          node-version: ${{ env.NODE_VERSION }}
          verify-electron: 'true'
          wasm: 'true'

      - name: Electron E2E search match scroll
        run: pnpm run test:e2e e2e-search --reporter verbose

      - name: Upload Electron E2E artifacts
        if: ${{ always() }}
        uses: ./.github/actions/upload-electron-e2e-artifacts
        with:
          artifact-name: electron-search-match-scroll-${{ github.run_attempt }}

  nightly_electron_e2e_large_pdf:
    name: Manual Electron E2E Large PDF
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: macos-14
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup CI environment
        uses: ./.github/actions/setup-ci-env
        with:
          node-version: ${{ env.NODE_VERSION }}
          verify-electron: 'true'
          wasm: 'true'

      - name: Electron E2E large PDF
        env:
          # Manual lanes opt in to the local exact fixture explicitly; the
          # staging script refuses an unnamed profile so absence cannot pass.
          EVB_EXACT_FIXTURE_PROFILE: localZaliznyak882
          EVB_E2E_REQUIRE_LARGE_PDF_FIXTURE: '1'
        run: pnpm run test:e2e e2e-large-pdf --reporter verbose

      - name: Upload Electron E2E artifacts
        if: ${{ always() }}
        uses: ./.github/actions/upload-electron-e2e-artifacts
        with:
          artifact-name: electron-large-pdf-${{ github.run_attempt }}

  nightly_electron_e2e_visible_window:
    name: Manual Electron E2E Visible Window
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup CI environment
        uses: ./.github/actions/setup-ci-env
        with:
          node-version: ${{ env.NODE_VERSION }}
          verify-electron: 'true'
          wasm: 'true'

      - name: Electron E2E visible-window lifecycle
        run: pnpm run test:e2e:visible-window

      - name: Upload Electron E2E artifacts
        if: ${{ always() }}
        uses: ./.github/actions/upload-electron-e2e-artifacts
        with:
          artifact-name: electron-visible-window-${{ github.run_attempt }}
