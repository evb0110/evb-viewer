name: CI

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  pull_request:
  push:
    branches:
      - main
    # Every push to main gets its own exact-SHA run that runs to completion.
    # The release cutter trusts only push runs, so a path filter would leave
    # commits it cannot release from, and cancelling the previous run on a
    # newer push left main without any finished verdict when several
    # writers pushed minutes apart. The changed-area classifier diffs from
    # the last push whose run finished, so a run that starts while the
    # previous one is unfinished or was cancelled by hand covers both.
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pull-requests: read

env:
  # Pin exact Node 24 patch level so CI does not drift independently of local verification.
  NODE_VERSION: '24.11.1'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  EVB_E2E_PRESERVE_ARTIFACTS: '1'

jobs:
  publication_policy:
    name: Publication Policy
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout full history
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Reject local-only artifacts and unexplained checks
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_HEAD_SHA: ${{ github.sha }}
        # This widens to the pushed head's complete history when the before SHA is
        # absent or unreachable. That is the fail-closed force-push behavior; see
        # the publication-policy runbook in docs/contributing/releasing.md.
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            node scripts/check-publication-policy.mjs --pushed-range "$PR_BASE_SHA" "$PR_HEAD_SHA"
          else
            node scripts/check-publication-policy.mjs --pushed-range "$PUSH_BEFORE_SHA" "$PUSH_HEAD_SHA"
          fi

  pr_quality:
    name: Quality Gates
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup CI environment
        uses: ./.github/actions/setup-ci-env
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache-dependency-path: pnpm-lock.yaml

      - name: Restore validation caches
        uses: actions/cache@v5
        with:
          path: |
            .devkit/cache/lint
            .devkit/cache/typecheck
          key: quality-${{ runner.os }}-${{ runner.arch }}-node-${{ env.NODE_VERSION }}-${{ hashFiles('pnpm-lock.yaml', 'eslint.config.mjs', 'eslint-plugin-custom.mjs', 'landing/eslint.config.mjs', 'stylelint.config.mjs', 'tsconfig*.json', 'electron/tsconfig.json', 'landing/tsconfig.json', 'packages/*/tsconfig.json', 'scripts/tsconfig.json', 'server/tsconfig.json', 'tests/tsconfig.json') }}

      # The interop fixture validates and renders real PDFs with these tools.
      - name: Install PDF test tools
        run: scripts/ci/apt-install.sh imagemagick poppler-utils qpdf

      - name: Install unit-test image dependency
        id: setup
        run: python3 -m pip install --disable-pip-version-check Pillow==11.3.0

      # Provisioning ends here so every gate below can report on its own:
      # a failing gate must not hide the ones after it, while a broken
      # dependency install still skips them all rather than blaming the code.

      - name: Generate committed build artifacts and reject drift
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          pnpm run generate:build-artifacts
          pnpm run copy:pdfjs
          git diff --exit-code -- \
            app/assets/css/vendor/pdfjs-viewer-sanitized.css \
            app/platform/generated \
            native/evb-native-support/src/generated_native_tool_protocols.rs \
            public/pdfjs/images \
            scripts/release/generated-release-targets.cjs
          test -z "$(git ls-files --others --exclude-standard -- \
            app/assets/css/vendor/pdfjs-viewer-sanitized.css \
            app/platform/generated \
            native/evb-native-support/src/generated_native_tool_protocols.rs \
            public/pdfjs/images \
            scripts/release/generated-release-targets.cjs)"

      - name: Lint changed sources
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_HEAD_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base_sha="$PR_BASE_SHA"
          else
            base_sha="$(bash scripts/ci/push-diff-base.sh "$PUSH_BEFORE_SHA" "$PUSH_HEAD_SHA")"
          fi
          if [ -n "$base_sha" ] \
            && [ "$base_sha" != "0000000000000000000000000000000000000000" ] \
            && git rev-parse --verify "${base_sha}^{commit}" >/dev/null 2>&1; then
            pnpm run lint --changed --base="$base_sha"
          else
            pnpm run lint
          fi

      - name: Typecheck
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm run typecheck

      - name: Unit tests
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm run test:unit

      # The dependency audit is deliberately absent here. It fails on advisory
      # publication time, not on anything in the commit, so on the required
      # lane it blocked release cuts twice in one afternoon. It runs daily in
      # dependency-audit.yml and files an issue instead.
      # Release-check commands that previously ran only in the deleted release
      # quality job or the local gate. Push CI's gates_ok is the single
      # validation authority, so they run here, once, on every push.
      - name: Drizzle schema configuration
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm run check:drizzle-schema

      - name: Electron-builder ASAR unpack configuration
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm run check:electron-builder:asar-unpack

      - name: Web deploy source policy
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm run check:static:assets

  pr_electron_blocking_smoke:
    name: Electron Blocking Smoke
    if: ${{ (github.event_name == 'pull_request' || github.event_name == 'push') && needs.pr_changed_areas.outputs.electron_smoke == 'true' }}
    needs: pr_changed_areas
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup CI environment
        uses: ./.github/actions/setup-ci-env
        with:
          node-version: ${{ env.NODE_VERSION }}
          verify-electron: 'true'

      - name: Restore staged Electron native binaries
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            .tmp/scan-cleanup
            .tmp/pdf-page-ops
          key: electron-native-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('native/**', 'packages/contracts/**', 'scripts/build-native-tool.mjs', 'scripts/cargo-artifacts.mjs', 'scripts/generateNativeToolProtocols.ts', 'scripts/nativeResourceManifest.ts', 'scripts/native-rust-targets.mjs', 'rust-toolchain.toml', 'pnpm-lock.yaml') }}
          restore-keys: |
            electron-native-v2-${{ runner.os }}-${{ runner.arch }}-

      - name: Electron blocking core-PDF smoke
        run: pnpm run test:e2e:electron:blocking-smoke:headless

      - name: Upload Electron E2E artifacts
        if: ${{ always() }}
        uses: ./.github/actions/upload-electron-e2e-artifacts
        with:
          artifact-name: electron-blocking-smoke-${{ github.run_attempt }}

  # The same Linux x64 job the release matrix runs, minus the artifact upload:
  # strict build, native-tool bundling, AppImage and DEB packaging, packaged
  # native-tool and content checks, and the installed core-PDF journeys. A
  # release must never be the first execution of its own packaged proof.
  pr_packaged_linux:
    name: Packaged Linux Proof
    if: ${{ (github.event_name == 'pull_request' || github.event_name == 'push') && needs.pr_changed_areas.outputs.packaged_smoke == 'true' }}
    needs: pr_changed_areas
    uses: ./.github/workflows/build-target.yml
    with:
      os: ubuntu-22.04
      platform: linux
      arch: x64
      artifact_group: ci-linux-x64
      upload_artifacts: false

  pr_electron_native_save_reopen:
    name: Electron Native Save And Reopen
    if: ${{ (github.event_name == 'pull_request' || github.event_name == 'push') && needs.pr_changed_areas.outputs.electron_save_reopen == 'true' }}
    needs: pr_changed_areas
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup CI environment
        uses: ./.github/actions/setup-ci-env
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache-dependency-path: pnpm-lock.yaml

      - name: Install PDF test tools
        timeout-minutes: 15
        run: scripts/ci/apt-install.sh poppler-utils qpdf

      - name: Native save and fresh-process reopen
        run: pnpm run test:e2e:electron:save-pipeline

      - name: Upload Electron E2E artifacts
        if: ${{ always() }}
        uses: ./.github/actions/upload-electron-e2e-artifacts
        with:
          artifact-name: electron-native-save-reopen-${{ github.run_attempt }}

  pr_native_pdf_integration:
    name: Native PDF Save Integration
    if: ${{ (github.event_name == 'pull_request' || github.event_name == 'push') && needs.pr_changed_areas.outputs.native_or_build == 'true' }}
    needs: pr_changed_areas
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup CI environment
        uses: ./.github/actions/setup-ci-env
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache-dependency-path: pnpm-lock.yaml

      - name: Install PDF test tools
        timeout-minutes: 15
        run: scripts/ci/apt-install.sh qpdf

      - name: Build native PDF page operations
        run: pnpm run build:pdf-page-ops

      - name: Run native PDF integration gate
        run: pnpm exec vitest run --project native-integration

  pr_windows_atomic_pdf_replacement:
    name: Windows Atomic PDF Replacement
    if: ${{ (github.event_name == 'pull_request' || github.event_name == 'push') && needs.pr_changed_areas.outputs.electron_save_reopen == 'true' }}
    needs: pr_changed_areas
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup CI environment
        uses: ./.github/actions/setup-ci-env
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache-dependency-path: pnpm-lock.yaml

      - name: Run real Windows filesystem acceptance
        run: pnpm exec vitest run --project native-integration tests/integration/native/windowsAtomicPdfReplacement.test.ts

  pr_changed_areas:
    name: Changed Area Detection
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      browser_integration: ${{ steps.classify.outputs.browser_integration }}
      electron_smoke: ${{ steps.classify.outputs.electron_smoke }}
      electron_save_reopen: ${{ steps.classify.outputs.electron_save_reopen }}
      landing: ${{ steps.classify.outputs.landing }}
      native_or_build: ${{ steps.classify.outputs.native_or_build }}
      packaged_smoke: ${{ steps.classify.outputs.packaged_smoke }}
      scan_cleanup_export: ${{ steps.classify.outputs.scan_cleanup_export }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Classify changed areas from release policy
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_HEAD_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base_sha="$PR_BASE_SHA"
            head_sha="$PR_HEAD_SHA"
          else
            base_sha="$(bash scripts/ci/push-diff-base.sh "$PUSH_BEFORE_SHA" "$PUSH_HEAD_SHA")"
            head_sha="$PUSH_HEAD_SHA"
          fi
          node scripts/ci/classify-changed-areas.mjs --base="$base_sha" --head="$head_sha"

  pr_browser_integration:
    name: Browser Integration
    if: ${{ (github.event_name == 'pull_request' || github.event_name == 'push') && needs.pr_changed_areas.outputs.browser_integration == 'true' }}
    needs: pr_changed_areas
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup CI environment
        uses: ./.github/actions/setup-ci-env
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Browser integration tests
        run: pnpm run test:integration:browser

  pr_native_build_safety:
    name: Native And Build Safety
    if: ${{ (github.event_name == 'pull_request' || github.event_name == 'push') && needs.pr_changed_areas.outputs.native_or_build == 'true' }}
    needs: pr_changed_areas
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup CI environment
        uses: ./.github/actions/setup-ci-env
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install PDF test tools
        timeout-minutes: 15
        run: scripts/ci/apt-install.sh poppler-utils qpdf

      - name: Install Rust WASM target
        run: rustup target add wasm32-unknown-unknown

      - name: Install Rust lint components
        run: rustup component add rustfmt clippy

      - name: Build source-verified browser WASM artifacts
        run: node scripts/build-wasm-artifacts.mjs --output-dir=.tmp/wasm-artifacts

      - name: Stage source-verified browser WASM artifacts
        run: node scripts/stage-wasm-artifacts.mjs .tmp/wasm-artifacts

      - name: Restore Rust build caches
        # Push-lane accelerator only. The manual maintenance lanes stay cache-cold on
        # purpose as the cache-poisoning tripwire.
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/target
          key: rust-native-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('native/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: rust-native-${{ runner.os }}-${{ runner.arch }}-

      - name: Rust tests
        run: pnpm run test:rust

      - name: Scan-cleanup catastrophe baseline
        run: scripts/ci/scan-cleanup-oracles.sh native "$RUNNER_TEMP/scan-cleanup-oracles"

      - name: Rust formatting and clippy
        run: pnpm run lint:rust

      - name: Rust dependency policy
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: native/Cargo.toml

      - name: Strict build
        env:
          EVB_WASM_ARTIFACT_DIR: .tmp/wasm-artifacts
        run: pnpm run build:strict

      # Release-check command promoted from release time; push CI's gates_ok
      # is the single validation authority. The cargo-release-heavy
      # scan-cleanup gates run in the parallel pr_scan_cleanup_heavy job so
      # they widen coverage without lengthening this lane's serial path.
      - name: Electron bundle static integrity
        run: pnpm run test:electron-bundle-static-integrity:no-build

  pr_scan_cleanup_heavy:
    # The cargo-release-heavy canonical identity gate ran serially inside
    # Native And Build Safety and helped push that lane to 45-49 minutes
    # (issue #109's root growth). It runs as a parallel sibling, blocking
    # through gates_ok, off the native lane's serial path. The 18-minute
    # real-corpus suite was moved to manual maintenance after two blocking days with
    # zero catches (anti-accretion rule, docs/contributing/releasing.md).
    name: Scan Cleanup Heavy Gates
    if: ${{ (github.event_name == 'pull_request' || github.event_name == 'push') && needs.pr_changed_areas.outputs.native_or_build == 'true' }}
    needs: pr_changed_areas
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup CI environment
        uses: ./.github/actions/setup-ci-env
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install PDF text test tools
        timeout-minutes: 15
        run: scripts/ci/apt-install.sh poppler-utils

      - name: Restore Rust build caches
        # Push-lane accelerator only. The manual maintenance lanes stay cache-cold on
        # purpose as the cache-poisoning tripwire.
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/target
          key: rust-scan-heavy-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('native/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: rust-scan-heavy-${{ runner.os }}-${{ runner.arch }}-

      - name: Canonical scan-cleanup identity
        run: pnpm run test:scan-cleanup:canonical-identity

  pr_rust_tests_arm64:
    name: Rust Tests (Linux arm64)
    if: ${{ (github.event_name == 'pull_request' || github.event_name == 'push') && needs.pr_changed_areas.outputs.native_or_build == 'true' }}
    needs: pr_changed_areas
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup CI environment
        uses: ./.github/actions/setup-ci-env
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install PDF test tools
        timeout-minutes: 15
        run: scripts/ci/apt-install.sh poppler-utils qpdf

      - name: Restore Rust build caches
        # Push-lane accelerator only. The manual maintenance lanes stay cache-cold on
        # purpose as the cache-poisoning tripwire.
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/target
          key: rust-arm64-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('native/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: rust-arm64-${{ runner.os }}-${{ runner.arch }}-

      - name: Rust tests
        run: pnpm run test:rust

  pr_scan_cleanup_oracles:
    name: Scan Cleanup Export Oracles
    if: ${{ (github.event_name == 'pull_request' || github.event_name == 'push') && needs.pr_changed_areas.outputs.scan_cleanup_export == 'true' }}
    needs: pr_changed_areas
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup CI environment
        uses: ./.github/actions/setup-ci-env
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install PDF audit tools
        timeout-minutes: 15
        run: scripts/ci/apt-install.sh poppler-utils python3-numpy python3-opencv python3-pil qpdf

      - name: Preview, export, and word-loss gates
        run: scripts/ci/scan-cleanup-oracles.sh export "$RUNNER_TEMP/scan-cleanup-oracles"

  pr_landing_quality:
    name: Landing Quality Gates For Changed Sources
    if: ${{ (github.event_name == 'pull_request' || github.event_name == 'push') && needs.pr_changed_areas.outputs.landing == 'true' }}
    needs: pr_changed_areas
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup CI environment
        uses: ./.github/actions/setup-ci-env
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache-dependency-path: pnpm-lock.yaml

      - name: Landing lint
        run: pnpm --dir landing run lint

      - name: Landing typecheck
        run: pnpm --dir landing run typecheck

      - name: Landing build
        run: pnpm --dir landing run build

  gates_ok:
    name: gates_ok
    if: ${{ always() && (github.event_name == 'pull_request' || github.event_name == 'push') }}
    needs:
      - publication_policy
      - pr_quality
      - pr_changed_areas
      - pr_electron_blocking_smoke
      - pr_packaged_linux
      - pr_electron_native_save_reopen
      - pr_native_pdf_integration
      - pr_windows_atomic_pdf_replacement
      - pr_browser_integration
      - pr_native_build_safety
      - pr_scan_cleanup_heavy
      - pr_rust_tests_arm64
      - pr_scan_cleanup_oracles
      - pr_landing_quality
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Require every applicable PR and push gate
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          ELECTRON_SMOKE_CHANGED: ${{ needs.pr_changed_areas.outputs.electron_smoke }}
          PACKAGED_SMOKE_CHANGED: ${{ needs.pr_changed_areas.outputs.packaged_smoke }}
          ELECTRON_SAVE_REOPEN_CHANGED: ${{ needs.pr_changed_areas.outputs.electron_save_reopen }}
          BROWSER_INTEGRATION_CHANGED: ${{ needs.pr_changed_areas.outputs.browser_integration }}
          NATIVE_OR_BUILD_CHANGED: ${{ needs.pr_changed_areas.outputs.native_or_build }}
          SCAN_CLEANUP_EXPORT_CHANGED: ${{ needs.pr_changed_areas.outputs.scan_cleanup_export }}
          LANDING_CHANGED: ${{ needs.pr_changed_areas.outputs.landing }}
        run: |
          node <<'NODE'
          const needs = JSON.parse(process.env.NEEDS_JSON);
          const legitimatelySkippable = new Map([
            ['pr_electron_blocking_smoke', process.env.ELECTRON_SMOKE_CHANGED],
            ['pr_packaged_linux', process.env.PACKAGED_SMOKE_CHANGED],
            ['pr_electron_native_save_reopen', process.env.ELECTRON_SAVE_REOPEN_CHANGED],
            ['pr_windows_atomic_pdf_replacement', process.env.ELECTRON_SAVE_REOPEN_CHANGED],
            ['pr_browser_integration', process.env.BROWSER_INTEGRATION_CHANGED],
            ['pr_native_build_safety', process.env.NATIVE_OR_BUILD_CHANGED],
            ['pr_native_pdf_integration', process.env.NATIVE_OR_BUILD_CHANGED],
            ['pr_scan_cleanup_heavy', process.env.NATIVE_OR_BUILD_CHANGED],
            ['pr_rust_tests_arm64', process.env.NATIVE_OR_BUILD_CHANGED],
            ['pr_scan_cleanup_oracles', process.env.SCAN_CLEANUP_EXPORT_CHANGED],
            ['pr_landing_quality', process.env.LANDING_CHANGED],
          ]);
          const rejected = [];

          for (const [job, state] of Object.entries(needs)) {
            if (state.result === 'success') continue;
            if (state.result === 'skipped' && legitimatelySkippable.get(job) === 'false') continue;
            rejected.push(`${job}: ${state.result}`);
          }

          if (rejected.length > 0) {
            console.error(`Required CI gates did not pass:\n${rejected.join('\n')}`);
            process.exit(1);
          }
          console.log('Every applicable PR and push gate passed.');
          NODE

  nightly_rust_fuzz:
    name: Native Parser Fuzz Canaries
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install cargo-fuzz
        run: |
          rustup toolchain install nightly --profile minimal
          cargo install cargo-fuzz --version 0.13.1 --locked

      - name: Fuzz image decoders
        run: |
          for target in png jpeg tiff netpbm; do
            cargo +nightly fuzz run "$target" --fuzz-dir native/pdf-image-combine/fuzz -- -max_total_time=15
          done

      - name: Fuzz xref parsers
        run: |
          for target in xref-table xref-stream; do
            cargo +nightly fuzz run "$target" --fuzz-dir native/pdf-page-ops/fuzz -- -max_total_time=15
          done

      - name: Fuzz JBIG2 codec
        run: |
          for target in decode roundtrip; do
            cargo +nightly fuzz run "$target" --fuzz-dir native/jbig2-codec/fuzz -- -max_total_time=15
          done

