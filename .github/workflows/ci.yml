name: CI

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - labeled
  push:
    branches:
      - main
      - '*/integration'
      - 't3code/*integration*'
    # Every push to main gets its own exact-SHA run that runs to completion.
    # The release cutter trusts only push runs, so a path filter would leave
    # commits it cannot release from, and cancelling the previous run on a
    # newer push left main without any finished verdict when several
    # writers pushed minutes apart. The changed-area classifier diffs from
    # the last push whose run finished, so a run that starts while the
    # previous one is unfinished or was cancelled by hand covers both.
  workflow_dispatch:

# The one required CI verdict: gates_ok. A release is cut from a commit whose
# push run has a green gates_ok, and nothing else gates a release. Jobs run
# in parallel and are sized so the verdict lands in about fifteen minutes;
# the Electron E2E suite runs as a matrix of lanes, one per directory of
# tests/e2e/electron, against the one strict production build. A push that
# merges a pull request whose tree already passed runs only the smoke lane
# (see scripts/ci/push-diff-base.sh). Slow, heavy or
# large-fixture checks, timing budgets and the macOS E2E run live in
# ci-nightly.yml, which reports and never gates.
# A dispatched run skips the changed-area classifier and runs every job.

permissions:
  actions: read
  contents: read
  pull-requests: read

env:
  # Pin exact Node 26 patch level so CI does not drift independently of local verification.
  NODE_VERSION: '26.13.0'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  EVB_E2E_PRESERVE_ARTIFACTS: '1'

jobs:
  publication_policy:
    name: Publication Policy
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5

    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Reject local-only artifacts and unexplained checks
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_HEAD_SHA: ${{ github.sha }}
        # This widens to the pushed head's complete history when the before SHA is
        # absent or unreachable. That is the fail-closed force-push behavior; see
        # the publication-policy section of docs/contributing/release-guardrails.md.
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            node scripts/check-publication-policy.mjs --pushed-range "$PR_BASE_SHA" "$PR_HEAD_SHA"
          else
            node scripts/check-publication-policy.mjs --pushed-range "$PUSH_BEFORE_SHA" "$PUSH_HEAD_SHA"
          fi

  changed_areas:
    name: Changed Area Detection
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      browser_integration: ${{ steps.classify.outputs.browser_integration }}
      electron_smoke: ${{ steps.classify.outputs.electron_smoke }}
      electron_save_reopen: ${{ steps.classify.outputs.electron_save_reopen }}
      landing: ${{ steps.classify.outputs.landing }}
      rust: ${{ steps.classify.outputs.rust }}
      desktop_build: ${{ steps.classify.outputs.desktop_build }}
      scan_cleanup_export: ${{ steps.classify.outputs.scan_cleanup_export }}
      verified_tree: ${{ steps.classify.outputs.verified_tree }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Classify changed areas from release policy
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_HEAD_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        # An unresolvable base makes the classifier fail open, so a
        # dispatched run selects every job.
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base_sha="$PR_BASE_SHA"
            head_sha="$PR_HEAD_SHA"
          elif [ "$EVENT_NAME" = "push" ]; then
            base_sha="$(bash scripts/ci/push-diff-base.sh "$PUSH_BEFORE_SHA" "$PUSH_HEAD_SHA" ci.yml)"
            head_sha="$PUSH_HEAD_SHA"
          else
            base_sha='unavailable-push-base'
            head_sha="$PUSH_HEAD_SHA"
          fi
          node scripts/ci/classify-changed-areas.mjs --base="$base_sha" --head="$head_sha"
          if [ "$base_sha" = "$head_sha" ]; then
            echo 'verified_tree=true' >> "$GITHUB_OUTPUT"
          fi

  lint:
    name: Lint
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    needs: changed_areas
    if: ${{ needs.changed_areas.outputs.verified_tree != 'true' }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup CI environment
        id: setup
        uses: ./.github/actions/setup-ci-env
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Every step below reports on its own: a failing check must not hide the
      # ones after it, while a broken setup still skips them all.
      - name: Generate committed build artifacts and reject drift
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          pnpm run generate:build-artifacts
          pnpm run copy:pdfjs
          git diff --exit-code -- \
            app/assets/css/vendor/pdfjs-viewer-sanitized.css \
            app/platform/generated \
            packages/contracts/firstUnsupportedAnnotationCharacter.ts \
            public/pdfjs/images \
            scripts/release/generated-release-targets.cjs
          test -z "$(git ls-files --others --exclude-standard -- \
            app/assets/css/vendor/pdfjs-viewer-sanitized.css \
            app/platform/generated \
            public/pdfjs/images \
            scripts/release/generated-release-targets.cjs)"

      - name: Lint the whole tree
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm run lint

      # The dependency audit is deliberately absent. It fails on advisory
      # publication time, not on anything in the commit, so it runs daily in
      # dependency-audit.yml and files an issue instead.
      - name: Electron-builder ASAR unpack configuration
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm run check:electron-builder:asar-unpack

      - name: Web deploy source policy
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm run check:static:assets

      - name: Locale parity
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm run check:locales

  unit:
    name: Typecheck And Unit Tests
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    needs: changed_areas
    if: ${{ needs.changed_areas.outputs.verified_tree != 'true' }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup CI environment
        uses: ./.github/actions/setup-ci-env
        with:
          node-version: ${{ env.NODE_VERSION }}
          wasm: 'true'

      # Browser shards consume this same source-checked build, including its
      # receipt, instead of each compiling all three tools on a cold cache.
      - name: Share browser WASM builds
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: browser-wasm
          path: |
            public/wasm
            .tmp/wasm-build-ids.json
          include-hidden-files: true
          if-no-files-found: error

      - name: Restore typecheck cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .devkit/cache/typecheck
          key: typecheck-${{ runner.os }}-${{ runner.arch }}-node-${{ env.NODE_VERSION }}-${{ hashFiles('pnpm-lock.yaml', 'tsconfig*.json', 'electron/tsconfig.json', 'landing/tsconfig.json', 'packages/*/tsconfig.json', 'scripts/tsconfig.json', 'server/tsconfig.json', 'tests/tsconfig.json') }}

      # The interop fixture validates and renders real PDFs with these tools.
      - name: Install PDF test tools
        run: scripts/ci/apt-install.sh imagemagick poppler-utils qpdf xdotool

      - name: Install unit-test image dependency
        id: setup
        run: python3 -m pip install --disable-pip-version-check Pillow==11.3.0

      - name: Typecheck
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm run typecheck

      - name: Unit tests
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm run test:unit

  rust:
    name: Rust
    if: ${{ needs.changed_areas.outputs.rust == 'true' }}
    needs: changed_areas
    runs-on: ubuntu-26.04
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup CI environment
        uses: ./.github/actions/setup-ci-env
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install PDF test tools
        timeout-minutes: 15
        run: scripts/ci/apt-install.sh poppler-utils qpdf

      - name: Install Rust lint components
        run: rustup component add rustfmt clippy

      # Dependencies only: Cargo rebuilds workspace crates in a fresh
      # checkout anyway, and only main saves, so branches cannot add copies.
      - name: Restore Rust dependency cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: native -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Rust formatting and clippy
        run: pnpm run lint:rust

      # Pinned release binary, not a Docker image: the image pulled a base
      # layer from Docker Hub, whose auth endpoint outage failed unrelated PRs.
      - name: Restore cargo-deny archive
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/cargo-deny-0.20.2-x86_64-unknown-linux-musl.tar.gz
          key: cargo-deny-0.20.2-x86_64-unknown-linux-musl

      - name: Install cargo-deny
        env:
          CARGO_DENY_ARCHIVE: ${{ runner.temp }}/cargo-deny-0.20.2-x86_64-unknown-linux-musl.tar.gz
        run: |
          set -euo pipefail
          if [ ! -f "$CARGO_DENY_ARCHIVE" ]; then
            curl --fail --silent --show-error --location --output "$CARGO_DENY_ARCHIVE" \
              https://github.com/EmbarkStudios/cargo-deny/releases/download/0.20.2/cargo-deny-0.20.2-x86_64-unknown-linux-musl.tar.gz
          fi
          echo "9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f  $CARGO_DENY_ARCHIVE" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/cargo-deny-bin"
          tar -xzf "$CARGO_DENY_ARCHIVE" -C "$RUNNER_TEMP/cargo-deny-bin" --strip-components=1 --wildcards '*/cargo-deny'

      # Same invocation as EmbarkStudios/cargo-deny-action@v2 with its defaults
      # (log-level warn, arguments --all-features, command check).
      - name: Rust dependency policy
        env:
          CARGO_TERM_COLOR: always
        run: '"$RUNNER_TEMP/cargo-deny-bin/cargo-deny" --log-level warn --manifest-path native/Cargo.toml --all-features check'

      - name: Rust tests
        run: pnpm run test:rust

      - name: Scan-cleanup catastrophe baseline
        run: scripts/ci/scan-cleanup-oracles.sh native "$RUNNER_TEMP/scan-cleanup-oracles"

  # The one desktop production build of a run: the strict build, held to the
  # warning allowlist, of the renderer the packaged app loads, the Electron
  # bundle and the native tools. Every Electron E2E lane downloads it.
  strict_build:
    name: Strict Build
    if: ${{ needs.changed_areas.outputs.desktop_build == 'true' || needs.changed_areas.outputs.electron_smoke == 'true' || needs.changed_areas.outputs.verified_tree == 'true' }}
    needs: changed_areas
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    outputs:
      lanes: ${{ steps.lanes.outputs.lanes }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup CI environment
        uses: ./.github/actions/setup-ci-env
        with:
          node-version: ${{ env.NODE_VERSION }}
          wasm: 'true'

      # A staged tool is reused only when its build receipt matches the exact
      # source inputs, so a stale restore costs a rebuild, never a wrong binary.
      # The native integration and oracle jobs restore the same tools.
      - name: Restore staged Electron native binaries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with: &electron-native-binaries
          path: |
            .tmp/scan-cleanup
            .tmp/pdf-image-combine
            .tmp/pdf-page-ops
            .tmp/pdf-search
          # The runner image is part of the key: native tools built on one Ubuntu
          # image must not be restored on another. Update it with runs-on.
          key: electron-native-v2-ubuntu-26.04-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('native/**', 'packages/contracts/**', 'public/fonts/annotation/*.ttf', 'public/pdf/standard_fonts/LiberationSans-*.ttf', 'scripts/build-native-tool.mjs', 'scripts/native-build-id.mjs', 'scripts/cargo-artifacts.mjs', 'scripts/lib/build-environment.mjs', 'scripts/nativeResourceManifest.ts', 'scripts/native-rust-targets.mjs', 'rust-toolchain.toml', 'native/rust-toolchain.toml', 'pnpm-lock.yaml') }}
          restore-keys: |
            electron-native-v2-ubuntu-26.04-${{ runner.os }}-${{ runner.arch }}-

      - name: Strict build
        run: pnpm run build:strict

      - name: Electron bundle static integrity
        run: pnpm run test:electron-bundle-static-integrity:no-build

      - name: List lanes
        id: lanes
        env:
          VERIFIED_TREE: ${{ needs.changed_areas.outputs.verified_tree }}
        run: |
          if [ "$VERIFIED_TREE" = 'true' ]; then
            echo 'lanes=["e2e-smoke"]'
          else
            node scripts/electron-e2e-lanes.mjs
          fi >> "$GITHUB_OUTPUT"

      # A tarball keeps the native tools executable.
      - name: Pack build
        run: tar -cf electron-e2e-build.tar nuxt-output/public dist-electron public/wasm .tmp/wasm-build-ids.json .tmp/scan-cleanup .tmp/pdf-image-combine .tmp/pdf-page-ops .tmp/pdf-search

      - name: Upload build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: electron-e2e-build
          retention-days: 1
          path: electron-e2e-build.tar

  native_pdf_integration:
    name: Native PDF Save Integration
    if: ${{ needs.changed_areas.outputs.desktop_build == 'true' }}
    needs: changed_areas
    runs-on: ubuntu-26.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup CI environment
        uses: ./.github/actions/setup-ci-env
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore staged Electron native binaries
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with: *electron-native-binaries

      - name: Build native PDF page operations
        run: pnpm run build:pdf-page-ops

      - name: Run native PDF integration gate
        run: pnpm exec vitest run --project native-integration

  windows_atomic_pdf_replacement:
    name: Windows Atomic PDF Replacement
    if: ${{ needs.changed_areas.outputs.electron_save_reopen == 'true' }}
    needs: changed_areas
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup CI environment
        uses: ./.github/actions/setup-ci-env
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore Windows launcher build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tmp/windows-job-launcher
          key: windows-job-launcher-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('native/**', 'scripts/build-native-tool.mjs', 'scripts/native-build-id.mjs', 'scripts/cargo-artifacts.mjs', 'scripts/lib/build-environment.mjs', 'scripts/nativeResourceManifest.ts', 'scripts/native-rust-targets.mjs', 'native/rust-toolchain.toml', 'rust-toolchain.toml', 'pnpm-lock.yaml') }}

      - name: Build Windows Job Object launcher
        run: node scripts/build-native-tool.mjs windows-job-launcher

      - name: Run working-copy save witness unit tests
        run: >-
          pnpm exec vitest run --project unit-electron
          tests/unit/electron/originalPathSaveWitness.test.ts
          tests/unit/electron/workingCopy.test.ts

      - name: Run real Windows filesystem acceptance
        run: pnpm exec vitest run --project native-integration tests/integration/native/windowsAtomicPdfReplacement.test.ts

  browser_integration:
    name: Browser Integration (${{ matrix.shard }}/8)
    if: ${{ !cancelled() && needs.changed_areas.outputs.browser_integration == 'true' }}
    needs: [changed_areas, unit]
    runs-on: ubuntu-26.04
    # Reuse the unit job's WASM so cold native builds leave the browser job's
    # budget for tests. UI files each start Chromium and a Nuxt server; run
    # files one at a time on the four-CPU runner, with eight shards keeping
    # each inside the test step's own limit.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup CI environment
        uses: ./.github/actions/setup-ci-env
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download browser WASM builds
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: browser-wasm

      - name: Install Playwright Chromium
        # Playwright runs apt itself, so select the same probed Ubuntu mirrors
        # as apt-install.sh before it starts downloading system dependencies.
        run: |
          scripts/ci/select-apt-mirrors.sh
          pnpm exec playwright install --with-deps chromium

      - name: Browser integration tests
        timeout-minutes: 9
        run: pnpm run test:integration:browser -- --shard=${{ matrix.shard }}/8 --maxWorkers=1

  scan_cleanup_oracles:
    name: Scan Cleanup Export Oracles
    if: ${{ needs.changed_areas.outputs.scan_cleanup_export == 'true' }}
    needs: changed_areas
    runs-on: ubuntu-26.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup CI environment
        uses: ./.github/actions/setup-ci-env
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install PDF audit tools
        timeout-minutes: 15
        run: scripts/ci/apt-install.sh img2pdf poppler-utils python3-numpy python3-opencv python3-pil qpdf

      - name: Restore staged Electron native binaries
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with: *electron-native-binaries

      - name: Preview, export, and word-loss gates
        run: scripts/ci/scan-cleanup-oracles.sh export "$RUNNER_TEMP/scan-cleanup-oracles"

      # These checks load scan-cleanup WASM only; the shared wasm setup also
      # cold-builds the unrelated page-ops and image-combiner browser tools.
      - name: Build tools for native-backed TypeScript checks
        run: |
          rustup target add wasm32-unknown-unknown
          node scripts/build-wasm-tool.mjs scan-cleanup
          pnpm run build:pdf-image-combine

      - name: Native-backed detection, large output, and diagnostics checks
        env:
          EVB_REQUIRE_SCAN_CLEANUP_NATIVE_TESTS: '1'
          PYTHON: /usr/bin/python3
        run: >-
          pnpm exec vitest run --project unit-electron --project unit-scripts
          tests/unit/scripts/scanCleanupStagedWindowEndToEnd.test.ts
          tests/unit/electron/scanCleanupPipeline.test.ts
          tests/unit/scripts/scanCleanupDiagnosticsManifestRoots.test.ts

  landing:
    name: Landing
    if: ${{ needs.changed_areas.outputs.landing == 'true' }}
    needs: changed_areas
    runs-on: ubuntu-26.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup CI environment
        uses: ./.github/actions/setup-ci-env
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Landing typecheck
        run: pnpm --dir landing run typecheck

      - name: Landing build
        run: pnpm --dir landing run build

  electron_e2e:
    name: Electron E2E (${{ matrix.lane }})
    if: ${{ needs.changed_areas.outputs.electron_smoke == 'true' || needs.changed_areas.outputs.verified_tree == 'true' }}
    needs:
      - changed_areas
      - strict_build
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # One job per lane directory of tests/e2e/electron.
        lane: ${{ fromJSON(needs.strict_build.outputs.lanes) }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup CI environment
        uses: ./.github/actions/setup-ci-env
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: electron-e2e-build

      - name: Unpack build
        run: tar -xf electron-e2e-build.tar && rm electron-e2e-build.tar

      - name: Install PDF test tools
        run: scripts/ci/apt-install.sh ffmpeg imagemagick poppler-utils qpdf xdotool

      - name: Install Playwright Chromium
        # annotationStrokeParity compares Electron with standalone Chromium.
        if: ${{ matrix.lane == 'e2e-drawing' }}
        run: pnpm exec playwright install --with-deps chromium

      - name: Electron E2E ${{ matrix.lane }}
        run: bash scripts/test-electron-e2e-headless.sh --no-build "${{ matrix.lane }}" --reporter verbose

      - name: Upload Electron E2E artifacts
        if: ${{ always() }}
        uses: ./.github/actions/upload-electron-e2e-artifacts
        with:
          artifact-name: electron-${{ matrix.lane }}-${{ github.run_attempt }}

  gates_ok:
    name: gates_ok
    if: ${{ always() }}
    needs:
      - publication_policy
      - changed_areas
      - lint
      - unit
      - rust
      - strict_build
      - native_pdf_integration
      - windows_atomic_pdf_replacement
      - browser_integration
      - scan_cleanup_oracles
      - landing
      - electron_e2e
    runs-on: ubuntu-26.04
    timeout-minutes: 5

    steps:
      - name: Require every applicable gate
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          node <<'NODE'
          const needs = JSON.parse(process.env.NEEDS_JSON);
          const areas = needs.changed_areas.outputs ?? {};
          const verifiedTree = areas.verified_tree === 'true';
          // A job may be skipped only when the classifier said its area did
          // not change or the tree already passed; the publication policy has
          // no range to scan on a dispatched run.
          const legitimatelySkippable = new Map([
            ['publication_policy', process.env.EVENT_NAME === 'workflow_dispatch'],
            ['lint', verifiedTree],
            ['unit', verifiedTree],
            ['rust', areas.rust === 'false'],
            ['strict_build', areas.desktop_build === 'false' && areas.electron_smoke === 'false' && !verifiedTree],
            ['native_pdf_integration', areas.desktop_build === 'false'],
            ['windows_atomic_pdf_replacement', areas.electron_save_reopen === 'false'],
            ['browser_integration', areas.browser_integration === 'false'],
            ['scan_cleanup_oracles', areas.scan_cleanup_export === 'false'],
            ['landing', areas.landing === 'false'],
            ['electron_e2e', areas.electron_smoke === 'false' && !verifiedTree],
          ]);
          const rejected = [];

          for (const [job, state] of Object.entries(needs)) {
            if (state.result === 'success') continue;
            if (state.result === 'skipped' && legitimatelySkippable.get(job) === true) continue;
            rejected.push(`${job}: ${state.result}`);
          }

          if (rejected.length > 0) {
            console.error(`Required CI gates did not pass:\n${rejected.join('\n')}`);
            process.exit(1);
          }
          console.log('Every applicable gate passed.');
          NODE
