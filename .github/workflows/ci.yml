name: CI

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - labeled
  push:
    branches:
      - main
      - '*/integration'
      - 't3code/*integration*'
    # Every push to main gets its own exact-SHA run that runs to completion.
    # The release cutter trusts only push runs, so a path filter would leave
    # commits it cannot release from, and cancelling the previous run on a
    # newer push left main without any finished verdict when several
    # writers pushed minutes apart. The changed-area classifier diffs from
    # the last push whose run finished, so a run that starts while the
    # previous one is unfinished or was cancelled by hand covers both.
  workflow_dispatch:

# The one required CI verdict: gates_ok. A release is cut from a commit whose
# push run has a green gates_ok, and nothing else gates a release. Jobs run
# in parallel and are sized so the verdict lands in about fifteen minutes;
# the Electron E2E suite is split into lanes (vitest.shared.config.ts) that
# run as a matrix. Slow, heavy or large-fixture checks, timing budgets and
# the macOS E2E run live in ci-nightly.yml, which reports and never gates.
# A dispatched run skips the changed-area classifier and runs every job.

permissions:
  actions: read
  contents: read
  pull-requests: read

env:
  # Pin exact Node 24 patch level so CI does not drift independently of local verification.
  NODE_VERSION: '24.11.1'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  EVB_E2E_PRESERVE_ARTIFACTS: '1'

jobs:
  publication_policy:
    name: Publication Policy
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout full history
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Reject local-only artifacts and unexplained checks
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_HEAD_SHA: ${{ github.sha }}
        # This widens to the pushed head's complete history when the before SHA is
        # absent or unreachable. That is the fail-closed force-push behavior; see
        # the publication-policy section of docs/contributing/release-guardrails.md.
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            node scripts/check-publication-policy.mjs --pushed-range "$PR_BASE_SHA" "$PR_HEAD_SHA"
          else
            node scripts/check-publication-policy.mjs --pushed-range "$PUSH_BEFORE_SHA" "$PUSH_HEAD_SHA"
          fi

  changed_areas:
    name: Changed Area Detection
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      browser_integration: ${{ steps.classify.outputs.browser_integration }}
      electron_smoke: ${{ steps.classify.outputs.electron_smoke }}
      electron_save_reopen: ${{ steps.classify.outputs.electron_save_reopen }}
      landing: ${{ steps.classify.outputs.landing }}
      native_or_build: ${{ steps.classify.outputs.native_or_build }}
      scan_cleanup_export: ${{ steps.classify.outputs.scan_cleanup_export }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Classify changed areas from release policy
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_HEAD_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        # An unresolvable base makes the classifier fail open, so a
        # dispatched run selects every job.
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base_sha="$PR_BASE_SHA"
            head_sha="$PR_HEAD_SHA"
          elif [ "$EVENT_NAME" = "push" ]; then
            base_sha="$(bash scripts/ci/push-diff-base.sh "$PUSH_BEFORE_SHA" "$PUSH_HEAD_SHA" ci.yml)"
            head_sha="$PUSH_HEAD_SHA"
          else
            base_sha='unavailable-push-base'
            head_sha="$PUSH_HEAD_SHA"
          fi
          node scripts/ci/classify-changed-areas.mjs --base="$base_sha" --head="$head_sha"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup CI environment
        id: setup
        uses: ./.github/actions/setup-ci-env
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore lint cache
        uses: actions/cache@v5
        with:
          path: .devkit/cache/lint
          key: lint-${{ runner.os }}-${{ runner.arch }}-node-${{ env.NODE_VERSION }}-${{ hashFiles('pnpm-lock.yaml', 'eslint.config.mjs', 'eslint-plugin-custom.mjs', 'landing/eslint.config.mjs', 'stylelint.config.mjs') }}

      # Every step below reports on its own: a failing check must not hide the
      # ones after it, while a broken setup still skips them all.
      - name: Generate committed build artifacts and reject drift
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          pnpm run generate:build-artifacts
          pnpm run copy:pdfjs
          git diff --exit-code -- \
            app/assets/css/vendor/pdfjs-viewer-sanitized.css \
            app/platform/generated \
            native/evb-native-support/src/generated_native_tool_protocols.rs \
            public/pdfjs/images \
            scripts/release/generated-release-targets.cjs
          test -z "$(git ls-files --others --exclude-standard -- \
            app/assets/css/vendor/pdfjs-viewer-sanitized.css \
            app/platform/generated \
            native/evb-native-support/src/generated_native_tool_protocols.rs \
            public/pdfjs/images \
            scripts/release/generated-release-targets.cjs)"

      - name: Lint the whole tree
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm run lint

      # The dependency audit is deliberately absent. It fails on advisory
      # publication time, not on anything in the commit, so it runs daily in
      # dependency-audit.yml and files an issue instead.
      - name: Drizzle schema configuration
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm run check:drizzle-schema

      - name: Electron-builder ASAR unpack configuration
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm run check:electron-builder:asar-unpack

      - name: Web deploy source policy
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm run check:static:assets

  unit:
    name: Typecheck And Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup CI environment
        uses: ./.github/actions/setup-ci-env
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore typecheck cache
        uses: actions/cache@v5
        with:
          path: .devkit/cache/typecheck
          key: typecheck-${{ runner.os }}-${{ runner.arch }}-node-${{ env.NODE_VERSION }}-${{ hashFiles('pnpm-lock.yaml', 'tsconfig*.json', 'electron/tsconfig.json', 'landing/tsconfig.json', 'packages/*/tsconfig.json', 'scripts/tsconfig.json', 'server/tsconfig.json', 'tests/tsconfig.json') }}

      # The interop fixture validates and renders real PDFs with these tools.
      - name: Install PDF test tools
        run: scripts/ci/apt-install.sh imagemagick poppler-utils qpdf

      - name: Install unit-test image dependency
        id: setup
        run: python3 -m pip install --disable-pip-version-check Pillow==11.3.0

      - name: Typecheck
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm run typecheck

      - name: Unit tests
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm run test:unit

  rust:
    name: Rust
    if: ${{ needs.changed_areas.outputs.native_or_build == 'true' }}
    needs: changed_areas
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup CI environment
        uses: ./.github/actions/setup-ci-env
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install PDF test tools
        timeout-minutes: 15
        run: scripts/ci/apt-install.sh poppler-utils qpdf

      - name: Install Rust lint components
        run: rustup component add rustfmt clippy

      - name: Restore Rust build caches
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/target
          key: rust-native-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('native/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: rust-native-${{ runner.os }}-${{ runner.arch }}-

      - name: Rust formatting and clippy
        run: pnpm run lint:rust

      - name: Rust dependency policy
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: native/Cargo.toml

      - name: Rust tests
        run: pnpm run test:rust

      - name: Scan-cleanup catastrophe baseline
        run: scripts/ci/scan-cleanup-oracles.sh native "$RUNNER_TEMP/scan-cleanup-oracles"

  strict_build:
    name: Strict Build
    if: ${{ needs.changed_areas.outputs.native_or_build == 'true' }}
    needs: changed_areas
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup CI environment
        uses: ./.github/actions/setup-ci-env
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Rust WASM target
        run: rustup target add wasm32-unknown-unknown

      - name: Build source-verified browser WASM artifacts
        run: node scripts/build-wasm-artifacts.mjs --output-dir=.tmp/wasm-artifacts

      - name: Stage source-verified browser WASM artifacts
        run: node scripts/stage-wasm-artifacts.mjs .tmp/wasm-artifacts

      - name: Strict build
        env:
          EVB_WASM_ARTIFACT_DIR: .tmp/wasm-artifacts
        run: pnpm run build:strict

      - name: Electron bundle static integrity
        run: pnpm run test:electron-bundle-static-integrity:no-build

  native_pdf_integration:
    name: Native PDF Save Integration
    if: ${{ needs.changed_areas.outputs.native_or_build == 'true' }}
    needs: changed_areas
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup CI environment
        uses: ./.github/actions/setup-ci-env
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install PDF test tools
        timeout-minutes: 15
        run: scripts/ci/apt-install.sh qpdf

      - name: Build native PDF page operations
        run: pnpm run build:pdf-page-ops

      - name: Run native PDF integration gate
        run: pnpm exec vitest run --project native-integration

  windows_atomic_pdf_replacement:
    name: Windows Atomic PDF Replacement
    if: ${{ needs.changed_areas.outputs.electron_save_reopen == 'true' }}
    needs: changed_areas
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup CI environment
        uses: ./.github/actions/setup-ci-env
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Run real Windows filesystem acceptance
        run: pnpm exec vitest run --project native-integration tests/integration/native/windowsAtomicPdfReplacement.test.ts

  browser_integration:
    name: Browser Integration
    if: ${{ needs.changed_areas.outputs.browser_integration == 'true' }}
    needs: changed_areas
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup CI environment
        uses: ./.github/actions/setup-ci-env
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Browser integration tests
        run: pnpm run test:integration:browser

  scan_cleanup_oracles:
    name: Scan Cleanup Export Oracles
    if: ${{ needs.changed_areas.outputs.scan_cleanup_export == 'true' }}
    needs: changed_areas
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup CI environment
        uses: ./.github/actions/setup-ci-env
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install PDF audit tools
        timeout-minutes: 15
        run: scripts/ci/apt-install.sh img2pdf poppler-utils python3-numpy python3-opencv python3-pil qpdf

      - name: Preview, export, and word-loss gates
        run: scripts/ci/scan-cleanup-oracles.sh export "$RUNNER_TEMP/scan-cleanup-oracles"

  landing:
    name: Landing
    if: ${{ needs.changed_areas.outputs.landing == 'true' }}
    needs: changed_areas
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup CI environment
        uses: ./.github/actions/setup-ci-env
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Landing lint
        run: pnpm --dir landing run lint

      - name: Landing typecheck
        run: pnpm --dir landing run typecheck

      - name: Landing build
        run: pnpm --dir landing run build

  electron_e2e:
    name: Electron E2E (${{ matrix.lane }})
    if: ${{ needs.changed_areas.outputs.electron_smoke == 'true' }}
    needs: changed_areas
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # The lanes of vitest.shared.config.ts that run per push; keep the two
        # lists and scripts/validation-gates.mjs in step.
        lane:
          - e2e-smoke
          - e2e-viewer
          - e2e-annotations
          - e2e-save-pipeline
          - e2e-documents
          - e2e-draw-shapes
          - e2e-core

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup CI environment
        uses: ./.github/actions/setup-ci-env
        with:
          node-version: ${{ env.NODE_VERSION }}
          verify-electron: 'true'

      - name: Install PDF test tools
        run: scripts/ci/apt-install.sh imagemagick poppler-utils qpdf

      - name: Restore staged Electron native binaries
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            .tmp/scan-cleanup
            .tmp/pdf-image-combine
            .tmp/pdf-page-ops
          key: electron-native-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('native/**', 'packages/contracts/**', 'scripts/build-native-tool.mjs', 'scripts/cargo-artifacts.mjs', 'scripts/generateNativeToolProtocols.ts', 'scripts/nativeResourceManifest.ts', 'scripts/native-rust-targets.mjs', 'rust-toolchain.toml', 'pnpm-lock.yaml') }}
          restore-keys: |
            electron-native-v2-${{ runner.os }}-${{ runner.arch }}-

      - name: Install Playwright Chromium
        # annotationStrokeParity compares Electron with standalone Chromium.
        if: ${{ matrix.lane == 'e2e-draw-shapes' }}
        run: pnpm exec playwright install --with-deps chromium

      - name: Electron E2E ${{ matrix.lane }}
        run: pnpm run test:e2e "${{ matrix.lane }}" --reporter verbose

      - name: Upload Electron E2E artifacts
        if: ${{ always() }}
        uses: ./.github/actions/upload-electron-e2e-artifacts
        with:
          artifact-name: electron-${{ matrix.lane }}-${{ github.run_attempt }}

  gates_ok:
    name: gates_ok
    if: ${{ always() }}
    needs:
      - publication_policy
      - changed_areas
      - lint
      - unit
      - rust
      - strict_build
      - native_pdf_integration
      - windows_atomic_pdf_replacement
      - browser_integration
      - scan_cleanup_oracles
      - landing
      - electron_e2e
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Require every applicable gate
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          node <<'NODE'
          const needs = JSON.parse(process.env.NEEDS_JSON);
          const areas = needs.changed_areas.outputs ?? {};
          // A job may be skipped only when the classifier said its area did
          // not change; the publication policy has no range to scan on a
          // dispatched run.
          const legitimatelySkippable = new Map([
            ['publication_policy', process.env.EVENT_NAME === 'workflow_dispatch'],
            ['rust', areas.native_or_build === 'false'],
            ['strict_build', areas.native_or_build === 'false'],
            ['native_pdf_integration', areas.native_or_build === 'false'],
            ['windows_atomic_pdf_replacement', areas.electron_save_reopen === 'false'],
            ['browser_integration', areas.browser_integration === 'false'],
            ['scan_cleanup_oracles', areas.scan_cleanup_export === 'false'],
            ['landing', areas.landing === 'false'],
            ['electron_e2e', areas.electron_smoke === 'false'],
          ]);
          const rejected = [];

          for (const [job, state] of Object.entries(needs)) {
            if (state.result === 'success') continue;
            if (state.result === 'skipped' && legitimatelySkippable.get(job) === true) continue;
            rejected.push(`${job}: ${state.result}`);
          }

          if (rejected.length > 0) {
            console.error(`Required CI gates did not pass:\n${rejected.join('\n')}`);
            process.exit(1);
          }
          console.log('Every applicable gate passed.');
          NODE
