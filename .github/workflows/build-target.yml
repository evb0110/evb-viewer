name: Release Build Target

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref or commit SHA to build.
        required: false
        type: string
      os:
        description: GitHub-hosted runner label for this release target.
        required: true
        type: string
      platform:
        description: Release platform identifier.
        required: true
        type: string
      arch:
        description: Release architecture identifier.
        required: true
        type: string
      artifact_group:
        description: Workflow artifact group name for the verified release files.
        required: true
        type: string
      release_environment:
        description: Environment used only for signed public-release builds.
        required: false
        default: artifact-build
        type: string
      sentry_environment:
        description: Closed Sentry build environment for this artifact.
        required: false
        default: test
        type: string
      send_sentry_canaries:
        description: Send one test source-map canary for every private bundle after upload.
        required: false
        default: false
        type: boolean
      upload_artifacts:
        description: >-
          Upload the verified release files as a workflow artifact. Push CI's
          packaged Linux proof runs this job for its checks only and sets
          this to false, so artifact_ready is false for that caller.
        required: false
        default: true
        type: boolean
    secrets:
      CSC_LINK:
        required: false
      CSC_KEY_PASSWORD:
        required: false
      APPLE_API_KEY:
        required: false
      APPLE_API_KEY_ID:
        required: false
      APPLE_API_ISSUER:
        required: false
      WIN_CSC_LINK:
        required: false
      WIN_CSC_KEY_PASSWORD:
        required: false
      SENTRY_AUTH_TOKEN:
        required: false
      SENTRY_VERIFICATION_TOKEN:
        required: false
      SENTRY_ORG:
        required: false
      SENTRY_DESKTOP_PROJECT:
        required: false
      SENTRY_DESKTOP_DSN:
        required: false
    outputs:
      artifact_ready:
        description: Whether this target uploaded an artifact group after every required package journey passed.
        value: ${{ jobs.build.outputs.artifact_ready }}

permissions:
  contents: read

env:
  # Pin exact Node 24 patch level so release builds do not drift under tags.
  NODE_VERSION: '24.11.1'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: build (${{ inputs.os }}, ${{ inputs.platform }}, ${{ inputs.arch }})
    environment: ${{ inputs.release_environment }}
    env:
      EVB_RELEASE_TARGET_ARCH: ${{ inputs.arch }}
      EVB_RELEASE_TARGET_PLATFORM: ${{ inputs.platform }}
      EVB_SENTRY_TARGET: desktop
      EVB_SENTRY_ENVIRONMENT: ${{ inputs.sentry_environment }}
      SENTRY_DESKTOP_DSN: ${{ secrets.SENTRY_DESKTOP_DSN }}
    outputs:
      artifact_ready: ${{ steps.artifact_status.outputs.artifact_ready }}
    runs-on: ${{ inputs.os }}
    # Shared by every release target. Source-map canary processing is remote
    # work and can outlive packaging by several minutes; keep a bounded margin
    # so a valid symbolication proof is not killed at the old 45-minute limit.
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.ref }}

      - name: Setup release environment
        # Fresh installs must leave Electron fully usable for later packaging.
        # The checked-in pnpm-workspace policy should make any drift fail in
        # the action's install/verify steps.
        uses: ./.github/actions/setup-release-env
        with:
          node-version: ${{ env.NODE_VERSION }}
          windows-bundle-cache-key: win-native-tools-${{ inputs.arch }}
          needs-msys2: ${{ inputs.platform == 'win' && inputs.arch == 'arm64' }}
          rust-targets: ${{ inputs.platform == 'win' && inputs.arch == 'arm64' && 'wasm32-unknown-unknown aarch64-pc-windows-msvc' || 'wasm32-unknown-unknown' }}
          brew-formulae: ${{ inputs.platform == 'mac' && 'tesseract poppler qpdf djvulibre meson pkg-config sphinx-doc' || '' }}
          needs-system-fpm: ${{ inputs.platform == 'linux' }}

      - name: Resolve Sentry build identity
        shell: bash
        run: node scripts/release/resolve-sentry-build-identity.mjs --target=desktop

      - name: Test Windows PDF append sharing
        if: runner.os == 'Windows' && inputs.arch == 'x64'
        shell: bash
        run: >-
          cargo test --manifest-path native/Cargo.toml --package evb-pdf-page-ops
          --locked windows_in_place_append_succeeds_when_delete_sharing_is_denied

      - name: Bundle native tools (macOS)
        if: runner.os == 'macOS'
        run: |
          bash scripts/bundle-tesseract-macos.sh
          bash scripts/bundle-leptonica-unpaper-macos.sh
          bash scripts/bundle-pdf-tools-macos.sh
          bash scripts/bundle-djvu-macos.sh

      # Linux: install via apt and bundle with patchelf
      - name: Bundle native tools (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 20
        run: |
          docker run --rm \
            --env EVB_HOST_GID="$(id -g)" \
            --env EVB_HOST_UID="$(id -u)" \
            --volume "$PWD:/workspace" \
            --workdir /workspace \
            ubuntu@sha256:2edbbc5dc405e9612ba3584ce95480277e3eb374407b5505fe26f17df77c7dbc \
            bash -c \
              'status=0; bash scripts/bundle-tools-linux.sh || status=$?; chown -R "$EVB_HOST_UID:$EVB_HOST_GID" resources; exit "$status"'

      # Windows: x64 downloads pre-built release ZIPs; arm64 uses MSYS2 clangarm64
      # on the native ARM64 runner, allowing the packaged sidecar smoke to execute.
      - name: Bundle native tools (Windows)
        if: runner.os == 'Windows'
        shell: bash
        env:
          WIN_BUNDLE_CACHE_DIR: ${{ runner.temp }}/win-bundle-cache
        run: TARGET_ARCH="$EVB_RELEASE_TARGET_ARCH" bash scripts/bundle-tools-windows.sh

      - name: Build (Nuxt + Electron)
        env:
          EVB_NATIVE_TARGET_ARCH: ${{ inputs.arch }}
          EVB_NATIVE_TARGET_PLATFORM: ${{ inputs.platform }}
        run: pnpm run build:strict

      - name: Upload strict build log on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: build-log-${{ inputs.platform }}-${{ inputs.arch }}-${{ github.run_attempt }}
          path: .tmp/build.log
          if-no-files-found: ignore

      - name: Configure optional macOS signing and notarization
        if: runner.os == 'macOS'
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: bash scripts/release/configure-macos-signing.sh

      - name: Package installer (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          if [ -n "${MAC_CSC_LINK:-}" ] && [ -n "${MAC_CSC_KEY_PASSWORD:-}" ]; then
            export CSC_LINK="$MAC_CSC_LINK"
            export CSC_KEY_PASSWORD="$MAC_CSC_KEY_PASSWORD"
          else
            unset CSC_LINK CSC_KEY_PASSWORD
          fi

          if [ -n "${APPLE_API_KEY_PATH:-}" ] && [ -n "${APPLE_API_KEY_ID_ENV:-}" ] && [ -n "${APPLE_API_ISSUER_ENV:-}" ]; then
            export APPLE_API_KEY="$APPLE_API_KEY_PATH"
            export APPLE_API_KEY_ID="$APPLE_API_KEY_ID_ENV"
            export APPLE_API_ISSUER="$APPLE_API_ISSUER_ENV"
          else
            unset APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER
          fi

          bash scripts/release/run-with-retries.sh 3 20 "macOS packaging" \
            pnpm exec electron-builder --publish never --mac "--$EVB_RELEASE_TARGET_ARCH"

      - name: Notarize and staple macOS disk images
        if: runner.os == 'macOS'
        shell: bash
        run: |
          if [ -n "${MAC_CSC_LINK:-}" ] && [ -n "${MAC_CSC_KEY_PASSWORD:-}" ]; then
            export CSC_LINK="$MAC_CSC_LINK"
            export CSC_KEY_PASSWORD="$MAC_CSC_KEY_PASSWORD"
            bash scripts/release/import-macos-codesign-certificate.sh
          else
            unset CSC_LINK CSC_KEY_PASSWORD
          fi

          if [ -n "${APPLE_API_KEY_PATH:-}" ] && [ -n "${APPLE_API_KEY_ID_ENV:-}" ] && [ -n "${APPLE_API_ISSUER_ENV:-}" ]; then
            export APPLE_API_KEY="$APPLE_API_KEY_PATH"
            export APPLE_API_KEY_ID="$APPLE_API_KEY_ID_ENV"
            export APPLE_API_ISSUER="$APPLE_API_ISSUER_ENV"
          else
            unset APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER
          fi

          node scripts/release/notarize-macos-dmgs.mjs release

      - name: Verify macOS signature
        if: runner.os == 'macOS'
        shell: bash
        env:
          MAC_EXPECT_DEVELOPER_ID: ${{ env.MAC_EXPECT_DEVELOPER_ID }}
        run: bash scripts/release/verify-macos-signature.sh

      # pnpm may lose exec permission on the app-builder binary (pnpm/pnpm#8546)
      - name: Fix app-builder-bin permissions (Linux arm64)
        if: runner.os == 'Linux' && inputs.arch == 'arm64'
        run: |
          APP_BUILDER="$(find node_modules -path '*/app-builder-bin/linux/arm64/app-builder' -type f 2>/dev/null | head -1)"
          if [ -n "$APP_BUILDER" ]; then
            chmod +x "$APP_BUILDER"
            echo "Fixed permissions: $APP_BUILDER"
          else
            echo "::notice::app-builder binary not found; skipping explicit chmod workaround"
          fi

      - name: Package installer (Linux)
        if: runner.os == 'Linux'
        env:
          USE_SYSTEM_FPM: "true"
        run: pnpm exec electron-builder --publish never --linux "--$EVB_RELEASE_TARGET_ARCH"

      - name: Configure optional Windows signing
        if: runner.os == 'Windows'
        shell: bash
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          echo "WIN_CSC_LINK_ENV=" >> "$GITHUB_ENV"
          echo "WIN_CSC_KEY_PASSWORD_ENV=" >> "$GITHUB_ENV"
          echo "WIN_EXPECT_SIGNATURE=false" >> "$GITHUB_ENV"

          if [ -n "$WIN_CSC_LINK" ] && [ -n "$WIN_CSC_KEY_PASSWORD" ]; then
            echo "WIN_CSC_LINK_ENV=$WIN_CSC_LINK" >> "$GITHUB_ENV"
            echo "WIN_CSC_KEY_PASSWORD_ENV=$WIN_CSC_KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "WIN_EXPECT_SIGNATURE=true" >> "$GITHUB_ENV"
          elif [ -n "$WIN_CSC_LINK" ] || [ -n "$WIN_CSC_KEY_PASSWORD" ]; then
            if [ "${CI:-}" = "true" ]; then
              echo "::error::Partial WIN_CSC_* secrets detected; set both WIN_CSC_LINK and WIN_CSC_KEY_PASSWORD or neither"
              exit 1
            fi
            echo "::warning::Partial WIN_CSC_* secrets detected; building unsigned Windows installer"
          else
            echo "::notice::No Windows signing certificate configured; building unsigned Windows installer"
          fi

      - name: Package installer (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          if [ -n "${WIN_CSC_LINK_ENV:-}" ] && [ -n "${WIN_CSC_KEY_PASSWORD_ENV:-}" ]; then
            export WIN_CSC_LINK="$WIN_CSC_LINK_ENV"
            export WIN_CSC_KEY_PASSWORD="$WIN_CSC_KEY_PASSWORD_ENV"
          else
            unset WIN_CSC_LINK WIN_CSC_KEY_PASSWORD
          fi

          bash scripts/release/run-with-retries.sh 3 20 "Windows packaging" \
            pnpm exec electron-builder --publish never --win "--$EVB_RELEASE_TARGET_ARCH"

      - name: Verify Windows signature
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WIN_EXPECT_SIGNATURE: ${{ env.WIN_EXPECT_SIGNATURE }}
        run: |
          $executables = Get-ChildItem -Path release -Filter *.exe
          if (-not $executables) {
            Write-Error "No .exe artifact found in release/"
            exit 1
          }

          foreach ($exe in $executables) {
            $sig = Get-AuthenticodeSignature -FilePath $exe.FullName
            Write-Host "Installer: $($exe.Name)"
            Write-Host "Authenticode status: $($sig.Status)"

            if ($env:WIN_EXPECT_SIGNATURE -eq "true" -and $sig.Status -ne "Valid") {
              Write-Error "Windows installer is not validly signed"
              exit 1
            }
          }

      - name: Verify packaged native tools
        shell: bash
        run: bash scripts/verify-packaged-native-tools.sh "$EVB_RELEASE_TARGET_PLATFORM" "$EVB_RELEASE_TARGET_ARCH"

      - name: Verify packaged app contents
        shell: bash
        run: node scripts/release/assert-packaged-app-contents.mjs

      - name: Enforce Linux glibc 2.35 compatibility baseline
        if: runner.os == 'Linux'
        shell: bash
        run: node scripts/release/assert-linux-glibc-baseline.mjs release 2.35

      - name: Record Windows packaged-app provenance
        if: runner.os == 'Windows'
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          unpacked_dir="win-unpacked"
          if [ "$EVB_RELEASE_TARGET_ARCH" = "arm64" ]; then
            unpacked_dir="win-arm64-unpacked"
          fi
          node scripts/release/build-provenance.mjs create direct "$EVB_RELEASE_TARGET_ARCH" \
            "release/${unpacked_dir}/resources/app.asar" \
            "release/EVB-Viewer-${version}-win-${EVB_RELEASE_TARGET_ARCH}-provenance.json"

      - name: Verify installed Linux AppImage and DEB journeys
        if: runner.os == 'Linux'
        shell: bash
        # One core-PDF proof per shipped artifact (design charter: one
        # real-app proof per scenario): the AppImage and the installed DEB
        # each get one smoke. The unpacked-directory run was a third proof of
        # the same binary and was removed.
        run: |
          set -euo pipefail
          appimage="$(find release -maxdepth 1 -type f -name '*.AppImage' -print -quit)"
          deb="$(find release -maxdepth 1 -type f -name '*.deb' -print -quit)"
          test -n "$appimage"
          test -n "$deb"

          chmod +x "$appimage"
          APPIMAGE_EXTRACT_AND_RUN=1 xvfb-run -a \
            pnpm run test:packaged-core-pdf-smoke -- --executable "$appimage"

          package_name="$(dpkg-deb -f "$deb" Package)"
          cleanup_deb() {
            sudo apt-get remove -y "$package_name" >/dev/null 2>&1 || true
          }
          trap cleanup_deb EXIT
          sudo apt-get install -y "$(realpath "$deb")"
          installed_executable="$(command -v evb-viewer)"
          test -x "$installed_executable"
          xvfb-run -a pnpm run test:packaged-core-pdf-smoke -- --executable "$installed_executable"
          cleanup_deb
          trap - EXIT
          hash -r
          if command -v evb-viewer >/dev/null 2>&1; then
            echo "::error::DEB uninstall left the EVB Viewer executable installed."
            exit 1
          fi

      - name: Verify packaged Windows core PDF journey
        if: runner.os == 'Windows'
        shell: bash
        # One proof per invariant: this covers the packaged (unpacked) app and
        # stays blocking on both arches; the NSIS journey below covers the
        # installed app on both architectures.
        run: |
          executable="$(find release -type f -path '*/win*-unpacked/EVB Viewer.exe' -print -quit)"
          test -n "$executable"
          pnpm run test:packaged-core-pdf-smoke -- --executable "$executable"

      - name: Verify installed Windows NSIS journey
        if: runner.os == 'Windows'
        id: nsis_journey
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Get-ChildItem release -File -Filter '*-setup.exe' | Select-Object -First 1
          if (-not $installer) { throw 'Windows NSIS installer was not produced.' }

          $installDir = Join-Path $env:RUNNER_TEMP "evb-viewer-nsis-$env:EVB_RELEASE_TARGET_ARCH-${{ github.run_attempt }}"
          $appPath = Join-Path $installDir 'EVB Viewer.exe'
          $runtimePaths = @(
            $appPath,
            (Join-Path $installDir 'd3dcompiler_47.dll'),
            (Join-Path $installDir 'ffmpeg.dll'),
            (Join-Path $installDir 'libEGL.dll'),
            (Join-Path $installDir 'libGLESv2.dll')
          )
          function Write-InstallerDiagnostics {
            param(
              [string] $TargetDir,
              [string[]] $MissingPaths,
              [datetime] $Since
            )
            Get-ChildItem $TargetDir -Recurse -Force -ErrorAction SilentlyContinue |
              ForEach-Object { Write-Host "Installer output: $($_.FullName)" }
            Write-Host "Missing runtime paths: $($MissingPaths -join ', ')"
            Get-CimInstance Win32_Process -ErrorAction SilentlyContinue |
              Where-Object { $_.Name -match '(?i)(evb|setup|install|nsis|7z)' } |
              Select-Object Name, ProcessId, ParentProcessId, ExecutablePath, CommandLine |
              Format-List | Out-String | Write-Host
            if (Get-Command Get-MpThreatDetection -ErrorAction SilentlyContinue) {
              Get-MpThreatDetection -ErrorAction SilentlyContinue |
                Select-Object InitialDetectionTime, ThreatName, Resources |
                Format-List | Out-String | Write-Host
            }
            Get-WinEvent -FilterHashtable @{
              LogName = 'Microsoft-Windows-Windows Defender/Operational'
              StartTime = $Since
            } -ErrorAction SilentlyContinue |
              Select-Object -First 20 TimeCreated, Id, Message |
              Format-List | Out-String | Write-Host
          }

          $installStartedAt = Get-Date
          $install = Start-Process -FilePath $installer.FullName `
            -ArgumentList '/S', "/D=$installDir" -PassThru
          if (-not $install.WaitForExit(120000)) {
            Write-InstallerDiagnostics -TargetDir $installDir -MissingPaths $runtimePaths -Since $installStartedAt
            Stop-Process -Id $install.Id -Force -ErrorAction SilentlyContinue
            throw 'NSIS installer launcher did not exit before the deadline.'
          }
          if ($install.ExitCode -ne 0) { throw "NSIS installer exited with $($install.ExitCode)." }
          # Assisted NSIS installers can leave their extraction child running
          # after the launcher exits. The ARM64 payload is large enough that the
          # PE files may arrive well after static resources and the uninstaller.
          $installDeadline = $installStartedAt.AddMinutes(15)
          $nextProgressAt = $installStartedAt.AddSeconds(30)
          $missingRuntimePaths = @($runtimePaths | Where-Object { -not (Test-Path $_ -PathType Leaf) })
          while ($missingRuntimePaths.Count -gt 0 -and (Get-Date) -lt $installDeadline) {
            Start-Sleep -Milliseconds 500
            $missingRuntimePaths = @($runtimePaths | Where-Object { -not (Test-Path $_ -PathType Leaf) })
            if ((Get-Date) -ge $nextProgressAt) {
              $installedFiles = @(Get-ChildItem $installDir -Recurse -File -Force -ErrorAction SilentlyContinue)
              $installedBytes = ($installedFiles | Measure-Object -Property Length -Sum).Sum
              Write-Host "NSIS extraction progress: $($installedFiles.Count) files, $installedBytes bytes, $($missingRuntimePaths.Count) required runtime files missing."
              $nextProgressAt = (Get-Date).AddSeconds(30)
            }
          }
          if ($missingRuntimePaths.Count -gt 0) {
            Write-InstallerDiagnostics `
              -TargetDir $installDir `
              -MissingPaths $missingRuntimePaths `
              -Since $installStartedAt
            throw 'Installed EVB Viewer runtime did not become ready before the deadline.'
          }
          $app = Get-Item $appPath

          try {
            pnpm run test:packaged-core-pdf-smoke -- --executable $app.FullName
            if ($LASTEXITCODE -ne 0) { throw "Installed NSIS smoke failed with $LASTEXITCODE." }
          } finally {
            $uninstaller = Get-ChildItem $installDir -File -Filter 'Uninstall*.exe' | Select-Object -First 1
            if ($uninstaller) {
              $uninstall = Start-Process -FilePath $uninstaller.FullName -ArgumentList '/S' -Wait -PassThru
              if ($uninstall.ExitCode -ne 0) { throw "NSIS uninstaller exited with $($uninstall.ExitCode)." }
            }
          }
          $uninstallDeadline = (Get-Date).AddMinutes(3)
          while ((Test-Path $appPath) -and (Get-Date) -lt $uninstallDeadline) {
            Start-Sleep -Milliseconds 500
          }
          if (Test-Path $appPath) { throw 'NSIS uninstall left the EVB Viewer executable installed.' }

      - name: Verify packaged macOS arm64 core PDF journey
        if: runner.os == 'macOS' && inputs.arch == 'arm64'
        shell: bash
        run: pnpm run test:packaged-core-pdf-smoke -- --executable "release/mac-arm64/EVB Viewer.app/Contents/MacOS/EVB Viewer"

      - name: Upload packaged core PDF diagnostics
        if: failure() || steps.nsis_journey.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: packaged-core-pdf-smoke-${{ inputs.platform }}-${{ inputs.arch }}-${{ github.run_attempt }}
          path: .devkit/test/packaged-core-pdf-smoke/**
          include-hidden-files: true
          if-no-files-found: ignore

      - name: Verify packaged startup
        if: runner.os == 'macOS'
        shell: bash
        # Keep the fast startup marker alongside the stronger macOS arm64 core-PDF journey.
        run: bash scripts/verify-packaged-startup.sh "$EVB_RELEASE_TARGET_PLATFORM" "$EVB_RELEASE_TARGET_ARCH"

      - name: Verify signed bundle through LaunchServices
        if: runner.os == 'macOS' && env.MAC_EXPECT_DEVELOPER_ID == 'true'
        shell: bash
        run: |
          mkdir -p .devkit/test/macos-launchservices-startup
          set -o pipefail
          bash scripts/verify-macos-launchservices-startup.sh "$EVB_RELEASE_TARGET_PLATFORM" "$EVB_RELEASE_TARGET_ARCH" \
            2>&1 | tee .devkit/test/macos-launchservices-startup/verify.log

      - name: Upload macOS LaunchServices diagnostics
        if: failure() && runner.os == 'macOS' && env.MAC_EXPECT_DEVELOPER_ID == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: macos-launchservices-${{ inputs.arch }}-${{ github.run_attempt }}
          path: .devkit/test/macos-launchservices-startup/**
          include-hidden-files: true
          if-no-files-found: ignore

      - name: Prune updater metadata on unsupported updater targets
        if: |
          runner.os == 'Linux'
          || (runner.os == 'Windows' && (inputs.arch != 'x64' || env.WIN_EXPECT_SIGNATURE != 'true'))
          || (runner.os == 'macOS' && env.MAC_EXPECT_DEVELOPER_ID != 'true')
        shell: bash
        run: |
          # Unsigned mac builds still launch when installed fresh, but publishing
          # latest-mac.yml + blockmaps lets signed installs reconstruct an update
          # from mixed-signature blocks. Keep ad-hoc mac artifacts manual-only.
          #
          # Unsigned Windows installers also stay publishable, but updater feeds
          # are reserved for signed x64 builds so release behavior stays
          # deterministic across platforms and install paths.
          rm -f release/latest*.yml
          rm -f release/*.blockmap

      - name: Verify release artifacts
        shell: bash
        env:
          EVB_RELEASE_HAS_MAC_SIGNING: ${{ env.MAC_EXPECT_DEVELOPER_ID }}
          EVB_RELEASE_HAS_WINDOWS_SIGNING: ${{ env.WIN_EXPECT_SIGNATURE }}
        run: node scripts/release/assert-build-artifacts.mjs release "$EVB_RELEASE_TARGET_PLATFORM" "$EVB_RELEASE_TARGET_ARCH"

      - name: Check private Sentry upload readiness
        id: sentry_upload
        if: ${{ inputs.upload_artifacts }}
        shell: bash
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_VERIFICATION_CONFIGURED: ${{ secrets.SENTRY_VERIFICATION_TOKEN != '' }}
          SENTRY_DESKTOP_DSN: ${{ secrets.SENTRY_DESKTOP_DSN }}
          SENTRY_DESKTOP_PROJECT: ${{ secrets.SENTRY_DESKTOP_PROJECT }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
        run: |
          set -euo pipefail
          configured=0
          for value in "$SENTRY_AUTH_TOKEN" "$SENTRY_DESKTOP_DSN" "$SENTRY_DESKTOP_PROJECT" "$SENTRY_ORG"; do
            if [ -n "$value" ]; then configured=$((configured + 1)); fi
          done
          if [ "$configured" -eq 4 ]; then
            if [ "${{ inputs.send_sentry_canaries }}" = 'true' ] && [ "$SENTRY_VERIFICATION_CONFIGURED" != 'true' ]; then
              echo '::error::SENTRY_VERIFICATION_TOKEN is required when source-map canaries are enabled.'
              exit 1
            fi
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          elif [ "$configured" -eq 0 ]; then
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo '::notice::Private Sentry upload is not configured; diagnostics remain disabled.'
          else
            echo '::error::Sentry diagnostics credentials are partially configured.'
            exit 1
          fi

      - name: Upload private Sentry source maps
        if: steps.sentry_upload.outputs.enabled == 'true'
        shell: bash
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_DESKTOP_PROJECT: ${{ secrets.SENTRY_DESKTOP_PROJECT }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
        run: node scripts/release/upload-sentry-sourcemaps.mjs

      - name: Verify packaged diagnostics consent and crash matrix
        if: steps.sentry_upload.outputs.enabled == 'true'
        shell: bash
        run: |
          if [ "${{ runner.os }}" = 'Linux' ]; then
            xvfb-run -a pnpm exec tsx scripts/release/verifyPackagedDiagnosticsSmoke.ts
          else
            pnpm exec tsx scripts/release/verifyPackagedDiagnosticsSmoke.ts
          fi

      - name: Send private Sentry source-map canaries
        if: steps.sentry_upload.outputs.enabled == 'true' && inputs.send_sentry_canaries
        shell: bash
        run: node scripts/release/send-sentry-sourcemap-canaries.mjs

      - name: Verify private Sentry source-map canaries
        if: steps.sentry_upload.outputs.enabled == 'true' && inputs.send_sentry_canaries
        shell: bash
        env:
          SENTRY_VERIFICATION_TOKEN: ${{ secrets.SENTRY_VERIFICATION_TOKEN }}
          SENTRY_DESKTOP_PROJECT: ${{ secrets.SENTRY_DESKTOP_PROJECT }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
        run: node scripts/release/verify-sentry-sourcemap-canaries.mjs

      - name: Upload Sentry source-map verification receipt
        if: ${{ always() && steps.sentry_upload.outputs.enabled == 'true' && inputs.send_sentry_canaries }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sentry-sourcemap-verification-${{ inputs.artifact_group }}
          path: .tmp/private-sourcemaps/**/canary-verification-receipt.json
          if-no-files-found: error

      - name: Upload artifacts
        id: upload_artifacts
        if: ${{ inputs.upload_artifacts }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ inputs.artifact_group }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/latest*.yml
            release/*.blockmap
            release/*-provenance.json
          if-no-files-found: error

      - name: Record artifact readiness
        id: artifact_status
        if: ${{ always() }}
        shell: bash
        run: |
          echo "artifact_ready=${{ steps.upload_artifacts.outcome == 'success' && (runner.os != 'Windows' || steps.nsis_journey.outcome == 'success') }}" >> "$GITHUB_OUTPUT"
          {
            echo '## Installed Windows NSIS journey'
            echo
            echo "- Outcome: ${{ steps.nsis_journey.outcome }}"
            if [ "${{ runner.os }}" = 'Windows' ]; then
              echo '- Windows NSIS outcome is required for artifact readiness on every architecture.'
            else
              echo '- Windows NSIS journey is not applicable to this target.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
