name: Dependency Audit

# Advisory publication time is not a property of any commit, so the audit
# does not sit on the merge-blocking or release path. It runs daily and on
# demand, and reports through one open issue labelled dependency-audit.

concurrency:
  group: dependency-audit-${{ github.workflow }}
  cancel-in-progress: false

on:
  workflow_dispatch:
  schedule:
    - cron: '40 4 * * *'

permissions:
  contents: read

env:
  NODE_VERSION: '24.11.1'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  audit:
    name: Audit dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: main

      - name: Setup release environment
        id: setup
        uses: ./.github/actions/setup-release-env
        with:
          node-version: ${{ env.NODE_VERSION }}
          verify-electron: 'false'

      - name: Production dependency audit
        id: production_audit
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm run check:production-dependency-audit:production-only

      - name: Full-graph dependency audit
        id: full_audit
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm run check:production-dependency-audit

      - name: Report through the dependency-audit issue
        if: ${{ always() && steps.setup.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCTION_OUTCOME: ${{ steps.production_audit.outcome }}
          FULL_OUTCOME: ${{ steps.full_audit.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          # The checkout pins ref: main, so the audited graph is HEAD's, not
          # the event's github.sha (a dispatch may target another ref).
          AUDITED_SHA="$(git rev-parse HEAD)"
          label='dependency-audit'
          issue_number="$(gh issue list --label "$label" --state open --limit 1 --json number --jq '.[0].number // empty')"

          if [ "$PRODUCTION_OUTCOME" = 'success' ] && [ "$FULL_OUTCOME" = 'success' ]; then
            echo "Both audits are clean for $AUDITED_SHA."
            if [ -n "$issue_number" ]; then
              # Every comment is mailed under the issue title, which says
              # advisories were found. Report the recovery once, not daily.
              clean_prefix='Both dependency audits passed'
              last_report="$(gh issue view "$issue_number" --json comments \
                --jq '[.comments[] | select(.author.login == "github-actions")] | last | .body // ""')"
              case "$last_report" in
                "$clean_prefix"*)
                  echo "Issue #$issue_number already records a clean audit."
                  ;;
                *)
                  gh issue comment "$issue_number" --body "$(printf '%s for %s.\n\nRun: %s' "$clean_prefix" "$AUDITED_SHA" "$RUN_URL")"
                  ;;
              esac
            fi
            exit 0
          fi

          body="$(printf '%s\n' \
            "The scheduled dependency audit found advisories that need dependency work." \
            "" \
            "- Production-only audit: $PRODUCTION_OUTCOME" \
            "- Full-graph audit: $FULL_OUTCOME" \
            "- Audited commit: $AUDITED_SHA" \
            "- Run with the advisory list: $RUN_URL" \
            "" \
            "Advisories never block push CI or a release cut. Fix them as ordinary dependency work:" \
            "update or override the affected package, keep \`pnpm run check:production-dependency-audit:production-only\` green locally," \
            "and note in the commit when a fix version is younger than the seven-day \`minimumReleaseAge\` hold in \`pnpm-workspace.yaml\`." \
            "" \
            "This issue is maintained by \`dependency-audit.yml\`. The first clean run after a failing one comments here instead of closing it.")"

          if [ -n "$issue_number" ]; then
            gh issue comment "$issue_number" --body "$body"
          else
            gh issue create \
              --title "Dependency audit found advisories" \
              --label "$label" \
              --label easy \
              --body "$body"
          fi
          exit 1
