name: Supplemental release
run-name: Supplemental release ${{ inputs.tag }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Public release tag to supplement (for example v1.2.3).
        required: true
        type: string
      workflow_sha:
        description: Optional trusted workflow revision containing release helpers.
        required: false
        type: string
  workflow_call:
    inputs:
      tag:
        description: Release tag to supplement.
        required: true
        type: string
      workflow_sha:
        description: Trusted workflow revision containing release helpers.
        required: false
        default: ''
        type: string
      drill:
        description: Attach drill stubs to a draft release without running platform builds.
        required: false
        default: false
        type: boolean
      mirror_prefix:
        description: Optional release mirror prefix override.
        required: false
        default: ''
        type: string
      channel_key:
        description: Optional release mirror channel key override.
        required: false
        default: ''
        type: string

concurrency:
  group: release-supplemental-${{ inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: '24.11.1'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  resolve:
    name: Resolve supplemental release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      target_sha: ${{ steps.resolve.outputs.target_sha }}
      version: ${{ steps.resolve.outputs.version }}
      workflow_sha: ${{ steps.resolve.outputs.workflow_sha }}
      existing_mac_x64: ${{ steps.resolve.outputs.existing_mac_x64 }}
      existing_win_arm64: ${{ steps.resolve.outputs.existing_win_arm64 }}

    steps:
      - name: Checkout release helpers
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.workflow_sha || inputs.tag || github.sha }}

      - name: Setup release environment
        uses: ./.github/actions/setup-release-env
        with:
          node-version: ${{ env.NODE_VERSION }}
          install-dependencies: 'false'

      - name: Verify release visibility and resolve target
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
          INPUT_WORKFLOW_SHA: ${{ inputs.workflow_sha }}
          DRILL: ${{ inputs.drill }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$TAG" ]; then
            echo '::error::A supplemental release tag is required.'
            exit 1
          fi
          if [ "$DRILL" = 'true' ]; then
            if [[ ! "$TAG" =~ ^v0[.]0[.]0-drill[.][0-9]+$ ]]; then
              echo '::error::A drill release tag must be v0.0.0-drill.<run_id>.'
              exit 1
            fi
          elif [[ ! "$TAG" =~ ^v[0-9]+[.][0-9]+[.][0-9]+$ ]]; then
            echo '::error::A public supplemental release tag must be exactly vMAJOR.MINOR.PATCH.'
            exit 1
          fi

          release_json="$(gh release view "$TAG" --json isDraft,assets)"
          is_draft="$(jq -r '.isDraft' <<< "$release_json")"
          if [ "$DRILL" = 'true' ]; then
            if [ "$is_draft" != 'true' ]; then
              echo '::error::A supplemental drill requires a draft GitHub release.'
              exit 1
            fi
            target_sha="${INPUT_WORKFLOW_SHA:-$GITHUB_SHA}"
          else
            if [ "$is_draft" = 'true' ]; then
              echo "::error::GitHub release $TAG is still a draft. Supplemental assets require a public release."
              exit 1
            fi
            git fetch --no-tags origin "refs/tags/$TAG:refs/tags/$TAG"
            target_sha="$(git rev-parse --verify "$TAG^{commit}" 2>/dev/null || true)"
          fi
          if [[ ! "$target_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Could not resolve $TAG to one exact commit."
            exit 1
          fi

          workflow_sha="${INPUT_WORKFLOW_SHA:-$target_sha}"
          if [[ ! "$workflow_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo '::error::workflow_sha must be an exact commit SHA.'
            exit 1
          fi

          # Builds are not byte-reproducible, so a re-dispatch must not
          # rebuild an asset the release already holds: the immutable-asset
          # check would reject the fresh bytes. The attach jobs verify the
          # attached copy instead.
          version="${TAG#v}"
          remote_assets="$(jq -r '.assets[]?.name' <<< "$release_json")"
          has_asset() { grep -Fqx "$1" <<< "$remote_assets"; }
          existing_mac_x64=false
          if has_asset "EVB-Viewer-${version}-x64.zip"; then
            existing_mac_x64=true
            echo "::notice::$TAG already holds the macOS Intel ZIP; its build is skipped."
          fi
          existing_win_arm64=false
          win_arm64_installer="EVB-Viewer-${version}-arm64-setup.exe"
          win_arm64_provenance="EVB-Viewer-${version}-win-arm64-provenance.json"
          if has_asset "$win_arm64_installer" && has_asset "$win_arm64_provenance"; then
            existing_win_arm64=true
            echo "::notice::$TAG already holds the Windows ARM64 assets; their build is skipped."
          elif has_asset "$win_arm64_installer" || has_asset "$win_arm64_provenance"; then
            # The provenance describes the build that produced the installer,
            # so a fresh build cannot supply the missing half of the pair.
            echo "::error::$TAG holds only part of the Windows ARM64 pair ($win_arm64_installer, $win_arm64_provenance). Delete the orphan with 'gh release delete-asset $TAG <asset>' and re-dispatch so both are rebuilt together."
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "target_sha=$target_sha" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "workflow_sha=$workflow_sha" >> "$GITHUB_OUTPUT"
          echo "existing_mac_x64=$existing_mac_x64" >> "$GITHUB_OUTPUT"
          echo "existing_win_arm64=$existing_win_arm64" >> "$GITHUB_OUTPUT"

  release_credentials:
    name: Validate supplemental release credentials
    needs: resolve
    if: ${{ !inputs.drill }}
    runs-on: ubuntu-latest
    environment: release

    steps:
      - name: Validate public release credentials
        shell: bash
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$CSC_LINK" ] || [ -z "$CSC_KEY_PASSWORD" ] \
            || [ -z "$APPLE_API_KEY" ] || [ -z "$APPLE_API_KEY_ID" ] || [ -z "$APPLE_API_ISSUER" ]; then
            echo '::error::Public supplemental builds require Developer ID signing and App Store Connect notarization credentials.'
            exit 1
          fi
          if { [ -n "$WIN_CSC_LINK" ] && [ -z "$WIN_CSC_KEY_PASSWORD" ]; } \
            || { [ -z "$WIN_CSC_LINK" ] && [ -n "$WIN_CSC_KEY_PASSWORD" ]; }; then
            echo '::error::Partial Windows signing credentials detected; set both WIN_CSC_LINK and WIN_CSC_KEY_PASSWORD or neither.'
            exit 1
          fi

  build_win_arm64:
    name: Package Supplemental Windows ARM64 Assets
    needs:
      - resolve
      - release_credentials
    if: ${{ !cancelled() && !inputs.drill && needs.resolve.result == 'success' && needs.release_credentials.result == 'success' && needs.resolve.outputs.existing_win_arm64 != 'true' }}
    uses: ./.github/workflows/build-target.yml
    with:
      ref: ${{ needs.resolve.outputs.target_sha }}
      release_environment: release
      sentry_environment: production
      send_sentry_canaries: false
      os: windows-11-arm
      platform: win
      arch: arm64
      artifact_group: supplemental-win-arm64
    secrets:
      WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
      WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_VERIFICATION_TOKEN: ${{ secrets.SENTRY_VERIFICATION_TOKEN }}
      SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
      SENTRY_DESKTOP_PROJECT: ${{ secrets.SENTRY_DESKTOP_PROJECT }}
      SENTRY_DESKTOP_DSN: ${{ secrets.SENTRY_DESKTOP_DSN }}

  build_mac_intel:
    name: Package Supplemental macOS Intel Assets
    needs:
      - resolve
      - release_credentials
    if: ${{ !cancelled() && !inputs.drill && needs.resolve.result == 'success' && needs.release_credentials.result == 'success' && needs.resolve.outputs.existing_mac_x64 != 'true' }}
    uses: ./.github/workflows/build-mac-intel.yml
    with:
      ref: ${{ needs.resolve.outputs.target_sha }}
      sentry_environment: production
      release_environment: release
      send_sentry_canaries: false
    secrets:
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_VERIFICATION_TOKEN: ${{ secrets.SENTRY_VERIFICATION_TOKEN }}
      SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
      SENTRY_DESKTOP_PROJECT: ${{ secrets.SENTRY_DESKTOP_PROJECT }}
      SENTRY_DESKTOP_DSN: ${{ secrets.SENTRY_DESKTOP_DSN }}

  publish_store:
    name: Package Microsoft Store AppX
    needs: resolve
    if: ${{ !cancelled() && !inputs.drill && needs.resolve.result == 'success' }}
    uses: ./.github/workflows/store-appx.yml
    with:
      ref: ${{ needs.resolve.outputs.target_sha }}
      sentry_environment: production
      send_sentry_canaries: false
    secrets:
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_VERIFICATION_TOKEN: ${{ secrets.SENTRY_VERIFICATION_TOKEN }}
      SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
      SENTRY_DESKTOP_PROJECT: ${{ secrets.SENTRY_DESKTOP_PROJECT }}
      SENTRY_DESKTOP_DSN: ${{ secrets.SENTRY_DESKTOP_DSN }}

  attach_mac_intel:
    name: Attach Supplemental macOS Intel Asset
    needs:
      - resolve
      - build_mac_intel
    if: ${{ !cancelled() && needs.resolve.result == 'success' && (needs.resolve.outputs.existing_mac_x64 == 'true' || inputs.drill || needs.build_mac_intel.result == 'success') }}
    runs-on: ubuntu-latest
    environment: release
    permissions:
      attestations: write
      contents: write
      id-token: write

    steps:
      - name: Checkout resolved release
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ needs.resolve.outputs.target_sha }}

      - name: Setup release environment
        uses: ./.github/actions/setup-release-env
        with:
          node-version: ${{ env.NODE_VERSION }}
          install-dependencies: 'false'

      - name: Download drill Intel stub
        if: ${{ inputs.drill && needs.resolve.outputs.existing_mac_x64 != 'true' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: supplemental-drill-mac-x64
          path: artifacts

      - name: Download built Intel artifact
        if: ${{ !inputs.drill && needs.resolve.outputs.existing_mac_x64 != 'true' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: supplemental-mac-x64
          path: artifacts
          merge-multiple: true

      # A re-dispatch feeds the attached copy through the same validation and
      # immutable-asset check instead of a fresh, non-reproducible build.
      - name: Download the Intel ZIP already attached to the release
        if: ${{ needs.resolve.outputs.existing_mac_x64 == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
          RELEASE_VERSION: ${{ needs.resolve.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          gh release download "$RELEASE_TAG" --pattern "EVB-Viewer-${RELEASE_VERSION}-x64.zip" --dir artifacts

      - name: Validate Intel ZIP
        id: intel_asset
        env:
          RELEASE_VERSION: ${{ needs.resolve.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          expected="artifacts/EVB-Viewer-${RELEASE_VERSION}-x64.zip"
          if [ ! -f "$expected" ]; then
            echo "::error::Supplemental Intel artifact did not contain $(basename "$expected")."
            exit 1
          fi
          echo "expected=$expected" >> "$GITHUB_OUTPUT"

      - name: Attest Intel ZIP
        if: ${{ !inputs.drill && needs.resolve.outputs.existing_mac_x64 != 'true' }}
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: ${{ steps.intel_asset.outputs.expected }}

      - name: Attach Intel ZIP
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
          EXPECTED_ASSET: ${{ steps.intel_asset.outputs.expected }}
          DRILL: ${{ inputs.drill }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$DRILL" = 'true' ]; then
            node scripts/release/ensure-github-release-assets.mjs "$RELEASE_TAG" "$EXPECTED_ASSET" --drill
          else
            node scripts/release/ensure-github-release-assets.mjs "$RELEASE_TAG" "$EXPECTED_ASSET"
          fi

  attach_win_arm64:
    name: Attach Supplemental Windows ARM64 Assets
    needs:
      - resolve
      - build_win_arm64
    if: ${{ !cancelled() && needs.resolve.result == 'success' && (needs.resolve.outputs.existing_win_arm64 == 'true' || inputs.drill || needs.build_win_arm64.result == 'success') }}
    runs-on: ubuntu-latest
    environment: release
    permissions:
      attestations: write
      contents: write
      id-token: write

    steps:
      - name: Checkout resolved release
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ needs.resolve.outputs.target_sha }}

      - name: Setup release environment
        uses: ./.github/actions/setup-release-env
        with:
          node-version: ${{ env.NODE_VERSION }}
          install-dependencies: 'false'

      - name: Download drill Windows ARM64 stubs
        if: ${{ inputs.drill && needs.resolve.outputs.existing_win_arm64 != 'true' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: supplemental-drill-win-arm64
          path: artifacts

      - name: Download built Windows ARM64 artifact
        if: ${{ !inputs.drill && needs.resolve.outputs.existing_win_arm64 != 'true' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: supplemental-win-arm64
          path: artifacts
          merge-multiple: true

      - name: Download the Windows ARM64 assets already attached to the release
        if: ${{ needs.resolve.outputs.existing_win_arm64 == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
          RELEASE_VERSION: ${{ needs.resolve.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          gh release download "$RELEASE_TAG" \
            --pattern "EVB-Viewer-${RELEASE_VERSION}-arm64-setup.exe" \
            --pattern "EVB-Viewer-${RELEASE_VERSION}-win-arm64-provenance.json" \
            --dir artifacts
          # Older releases predate Windows updater feeds; preserve their assets.
          remote_assets="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[]?.name')"
          for asset in "latest-win-arm64.yml" "EVB-Viewer-${RELEASE_VERSION}-arm64-setup.exe.blockmap"; do
            if grep -Fqx "$asset" <<< "$remote_assets"; then
              gh release download "$RELEASE_TAG" --pattern "$asset" --dir artifacts
            fi
          done

      - name: Normalize downloaded Windows ARM64 assets
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d artifacts ]; then
            echo '::error::Windows ARM64 artifact directory was not created.'
            exit 1
          fi
          mv artifacts downloaded-windows-arm64-artifacts
          mkdir artifacts
          copied=0
          while IFS= read -r -d '' source; do
            name="$(basename "$source")"
            destination="artifacts/$name"
            if [ -e "$destination" ]; then
              echo "::error::Duplicate Windows ARM64 artifact basename: $name"
              exit 1
            fi
            cp "$source" "$destination"
            copied=$((copied + 1))
          done < <(find downloaded-windows-arm64-artifacts -type f -print0)
          if [ "$copied" -eq 0 ]; then
            echo '::error::Windows ARM64 artifact did not contain any files.'
            exit 1
          fi

      - name: Validate Windows ARM64 assets
        id: win_arm64_assets
        env:
          REUSED: ${{ needs.resolve.outputs.existing_win_arm64 }}
          RELEASE_VERSION: ${{ needs.resolve.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          installer="artifacts/EVB-Viewer-${RELEASE_VERSION}-arm64-setup.exe"
          provenance="artifacts/EVB-Viewer-${RELEASE_VERSION}-win-arm64-provenance.json"
          for expected in "$installer" "$provenance"; do
            if [ ! -f "$expected" ]; then
              echo "::error::Supplemental Windows ARM64 artifact did not contain $(basename "$expected")."
              exit 1
            fi
          done
          if [ "$REUSED" != 'true' ] || [ -f artifacts/latest-win-arm64.yml ]; then
            test -f artifacts/latest-win-arm64.yml
            test -f "$installer.blockmap"
            node --input-type=module <<'NODE'
          import { assertBuildArtifacts } from './scripts/release/assert-build-artifacts.mjs';
          assertBuildArtifacts({artifactsDir: 'artifacts', platform: 'win', arch: 'arm64', expectedVersion: process.env.RELEASE_VERSION});
          NODE
          elif [ -f "$installer.blockmap" ]; then
            echo '::error::Windows ARM64 blockmap exists without its update feed.'
            exit 1
          fi
          echo "installer=$installer" >> "$GITHUB_OUTPUT"
          echo "provenance=$provenance" >> "$GITHUB_OUTPUT"

      - name: Attest Windows ARM64 assets
        if: ${{ !inputs.drill && needs.resolve.outputs.existing_win_arm64 != 'true' }}
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: |
            ${{ steps.win_arm64_assets.outputs.installer }}
            ${{ steps.win_arm64_assets.outputs.provenance }}

      - name: Attach Windows ARM64 assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
          EXPECTED_INSTALLER: ${{ steps.win_arm64_assets.outputs.installer }}
          EXPECTED_PROVENANCE: ${{ steps.win_arm64_assets.outputs.provenance }}
          DRILL: ${{ inputs.drill }}
        shell: bash
        run: |
          set -euo pipefail
          files=("$EXPECTED_INSTALLER" "$EXPECTED_PROVENANCE")
          if [ -f artifacts/latest-win-arm64.yml ]; then
            files+=("$EXPECTED_INSTALLER.blockmap" "artifacts/latest-win-arm64.yml")
          fi
          if [ "$DRILL" = 'true' ]; then
            node scripts/release/ensure-github-release-assets.mjs "$RELEASE_TAG" "${files[@]}" --drill
          else
            node scripts/release/ensure-github-release-assets.mjs "$RELEASE_TAG" "${files[@]}"
          fi

  mirror_supplemental:
    name: Mirror supplemental assets
    needs:
      - resolve
      - attach_win_arm64
      - attach_mac_intel
    if: ${{ !cancelled() && needs.resolve.result == 'success' }}
    runs-on: ubuntu-latest
    # The Intel ZIP and the ARM64 installer are ~170 MB each, uploaded in
    # 8 MiB parts with the same bounded retries as the core mirror.
    timeout-minutes: 40
    environment: release
    # A drill release stays a draft, and GitHub shows a draft and its assets
    # only to a token that can write the repository's contents.
    permissions:
      contents: write

    steps:
      - name: Checkout trusted release publisher
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ needs.resolve.outputs.workflow_sha }}

      - name: Setup release environment
        uses: ./.github/actions/setup-release-env
        with:
          node-version: ${{ env.NODE_VERSION }}
          install-dependencies: 'false'

      - name: Install mirror publisher dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      # The mirror copies what the release actually holds, so a lane that
      # failed or was skipped leaves the others mirrored and repairs itself on
      # the next dispatch.
      - name: Mirror attached supplemental assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          MIRROR_S3_ENDPOINT: ${{ secrets.MIRROR_S3_ENDPOINT }}
          MIRROR_S3_BUCKET: ${{ secrets.MIRROR_S3_BUCKET }}
          MIRROR_S3_ACCESS_KEY_ID: ${{ secrets.MIRROR_S3_ACCESS_KEY_ID }}
          MIRROR_S3_SECRET_KEY: ${{ secrets.MIRROR_S3_SECRET_KEY }}
          MIRROR_RELEASE_PREFIX: ${{ inputs.mirror_prefix }}
          MIRROR_CHANNEL_KEY: ${{ inputs.channel_key }}
          DRILL: ${{ inputs.drill }}
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
          RELEASE_VERSION: ${{ needs.resolve.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          remote_assets="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[]?.name')"
          files=()
          for asset in \
            "EVB-Viewer-${RELEASE_VERSION}-x64.zip" \
            "EVB-Viewer-${RELEASE_VERSION}-arm64-setup.exe" \
            "EVB-Viewer-${RELEASE_VERSION}-arm64-setup.exe.blockmap" \
            "latest-win-arm64.yml" \
            "EVB-Viewer-${RELEASE_VERSION}-win-arm64-provenance.json"; do
            if grep -Fqx "$asset" <<< "$remote_assets"; then
              gh release download "$RELEASE_TAG" --pattern "$asset" --dir artifacts
              files+=("artifacts/$asset")
            else
              echo "::notice::$asset is not attached to $RELEASE_TAG; it gets no mirror copy."
            fi
          done
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::notice::$RELEASE_TAG holds no supplemental assets; the mirror is unchanged."
            exit 0
          fi
          args=("$RELEASE_TAG" "${files[@]}")
          if [ "$DRILL" = 'true' ]; then
            args+=(--drill)
          fi
          node scripts/release/publish-release-mirror.mjs supplemental "${args[@]}"

  summary:
    name: Summarize supplemental release
    needs:
      - resolve
      - release_credentials
      - build_win_arm64
      - build_mac_intel
      - publish_store
      - attach_win_arm64
      - attach_mac_intel
      - mirror_supplemental
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Write supplemental asset summary
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.resolve.outputs.tag }}
          VERSION: ${{ needs.resolve.outputs.version }}
          DRILL: ${{ inputs.drill }}
          WIN_ARM_BUILD_RESULT: ${{ needs.build_win_arm64.result }}
          MAC_INTEL_BUILD_RESULT: ${{ needs.build_mac_intel.result }}
          STORE_BUILD_RESULT: ${{ needs.publish_store.result }}
          WIN_ARM_ATTACH_RESULT: ${{ needs.attach_win_arm64.result }}
          MAC_INTEL_ATTACH_RESULT: ${{ needs.attach_mac_intel.result }}
          MIRROR_RESULT: ${{ needs.mirror_supplemental.result }}
          WIN_ARM_EXISTING: ${{ needs.resolve.outputs.existing_win_arm64 }}
          MAC_INTEL_EXISTING: ${{ needs.resolve.outputs.existing_mac_x64 }}
        shell: bash
        run: |
          set -euo pipefail
          win_arm_build="$WIN_ARM_BUILD_RESULT"
          if [ "$WIN_ARM_EXISTING" = 'true' ]; then
            win_arm_build='reused already attached assets'
          fi
          mac_intel_build="$MAC_INTEL_BUILD_RESULT"
          if [ "$MAC_INTEL_EXISTING" = 'true' ]; then
            mac_intel_build='reused already attached asset'
          fi
          {
            echo '## Supplemental release'
            echo
            echo "- Tag: \`$TAG\`"
            if [ "${DRILL:-false}" = 'true' ]; then
              echo '- Mode: publish-chain drill'
            else
              echo '- Mode: public release'
            fi
            echo
            echo '| Asset or lane | Build | Attach |'
            echo '| --- | --- | --- |'
            echo "| Windows ARM64 | $win_arm_build | $WIN_ARM_ATTACH_RESULT |"
            echo "| macOS Intel | $mac_intel_build | $MAC_INTEL_ATTACH_RESULT |"
            echo "| Microsoft Store packages | $STORE_BUILD_RESULT | workflow artifact only; no automated submission |"
            echo
            echo "Release mirror copies of the attached assets: $MIRROR_RESULT"
          } >> "$GITHUB_STEP_SUMMARY"

          if ! release_json="$(gh release view "$TAG" --json assets 2>/dev/null)"; then
            echo 'Release assets could not be read for the supplemental summary.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          remote_assets="$(jq -r '.assets[]?.name' <<< "$release_json")"
          for expected in \
            "EVB-Viewer-${VERSION}-x64.zip" \
            "EVB-Viewer-${VERSION}-arm64-setup.exe" \
            "EVB-Viewer-${VERSION}-win-arm64-provenance.json"; do
            if grep -Fqx "$expected" <<< "$remote_assets"; then
              echo "- Landed: \`$expected\`" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "- Missing: \`$expected\`" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
