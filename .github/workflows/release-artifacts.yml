name: Build Release Artifacts
run-name: Build Release Artifacts ${{ inputs.target_ref }}

concurrency:
  group: release-artifacts-${{ github.workflow }}-${{ inputs.target_ref || github.run_id }}
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: Exact commit SHA or ref to validate and package without publishing a release.
        required: true
        type: string
      send_sentry_canaries:
        description: Send test source-map canaries after each exact private-map upload.
        required: false
        default: false
        type: boolean
  schedule:
    - cron: '10 4 * * *'

permissions:
  contents: read

env:
  # Pin exact Node 24 patch level so artifact builds match release builds.
  NODE_VERSION: '24.11.1'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  freshness:
    name: Check main freshness
    if: ${{ github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      fresh: ${{ steps.freshness.outputs.fresh }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check main freshness
        id: freshness
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          main_epoch="$(git show -s --format=%ct refs/remotes/origin/main)"
          now_epoch="$(date -u +%s)"
          age_seconds=$((now_epoch - main_epoch))
          if [ "$age_seconds" -gt 86400 ]; then
            echo 'fresh=false' >> "$GITHUB_OUTPUT"
            echo "Main HEAD is $age_seconds seconds old; skipping the scheduled artifact canary."
            echo '## Artifact canary skipped' >> "$GITHUB_STEP_SUMMARY"
            echo >> "$GITHUB_STEP_SUMMARY"
            echo "Main HEAD is older than 24 hours ($age_seconds seconds)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo 'fresh=true' >> "$GITHUB_OUTPUT"
          echo "Main HEAD is $age_seconds seconds old; running the scheduled artifact canary."

  prepare:
    name: Resolve Target
    needs: freshness
    if: ${{ always() && (github.event_name != 'schedule' || needs.freshness.outputs.fresh == 'true') }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      target_sha: ${{ steps.validate.outputs.target_sha }}
      version: ${{ steps.validate.outputs.version }}
      require_quality: ${{ steps.validation.outputs.require_quality }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve requested artifact build
        id: target
        shell: bash
        env:
          DISPATCH_TARGET_REF: ${{ inputs.target_ref }}
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # The scheduled canary carries no inputs; it packages the current
          # main tip so packaging drift surfaces daily instead of at the next
          # release cut.
          if [ -z "$DISPATCH_TARGET_REF" ] && [ "$EVENT_NAME" = 'schedule' ]; then
            git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
            DISPATCH_TARGET_REF="$(git rev-parse refs/remotes/origin/main)"
            echo "::notice::Scheduled artifact canary targets main tip $DISPATCH_TARGET_REF."
          fi

          if [ -z "$DISPATCH_TARGET_REF" ]; then
            echo "::error::A target commit SHA or ref is required."
            exit 1
          fi

          target_sha="$(git rev-parse --verify "${DISPATCH_TARGET_REF}^{commit}" 2>/dev/null || true)"
          if [ -z "$target_sha" ]; then
            target_sha="$(gh api \
              -H 'Accept: application/vnd.github+json' \
              "repos/${GITHUB_REPOSITORY}/commits/${DISPATCH_TARGET_REF}" \
              --jq .sha 2>/dev/null || true)"
          fi
          if [[ ! "$target_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Could not resolve target ref '$DISPATCH_TARGET_REF' to one exact commit."
            exit 1
          fi

          git fetch --no-tags --depth=1 origin "$target_sha"
          git checkout --detach "$target_sha"
          echo "target_sha=$target_sha" >> "$GITHUB_OUTPUT"

      - name: Validate target
        id: validate
        shell: bash
        run: |
          set -euo pipefail

          target_sha="$(git rev-parse HEAD)"
          if [ "$target_sha" != "${{ steps.target.outputs.target_sha }}" ]; then
            echo "::error::Resolved target changed during checkout: expected ${{ steps.target.outputs.target_sha }}, got $target_sha."
            exit 1
          fi
          version="$(node -p "require('./package.json').version")"

          echo "target_sha=$target_sha" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Resolve validation authority
        id: validation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.validate.outputs.target_sha }}
        run: |
          set -euo pipefail

          # Green exact-SHA push CI (gates_ok) is the validation authority.
          # Rerunning the same release:verify:checks list here would validate
          # the commit a second time; keep the quality job only for commits
          # push CI never saw (for example branch builds).
          # This lookup is an optimization; any API or parse failure must fall
          # back to running the quality job, never fail the workflow.
          require_quality=true
          runs="$(gh api \
            -H 'Accept: application/vnd.github+json' \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${TARGET_SHA}&event=push&per_page=20" \
            || echo '{}')"
          run_id="$(jq -r --arg sha "$TARGET_SHA" \
            '[.workflow_runs[]? | select(.head_sha == $sha and .event == "push" and .status == "completed" and .conclusion == "success")] | sort_by(.run_number) | last | .id // empty' \
            <<< "$runs" || true)"
          if [ -n "$run_id" ]; then
            gates_conclusion="$(gh api \
              --paginate \
              -H 'Accept: application/vnd.github+json' \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs?per_page=100" \
              --jq '.jobs[] | select(.name == "gates_ok") | .conclusion' 2>/dev/null | tail -n 1 || true)"
            if [ "$gates_conclusion" = 'success' ]; then
              require_quality=false
              echo "::notice::Exact-SHA push CI run $run_id already passed gates_ok for $TARGET_SHA; skipping the redundant Shared Quality Gates job."
            fi
          fi
          if [ "$require_quality" = 'true' ]; then
            echo "::notice::No successful exact-SHA push CI covers $TARGET_SHA; running Shared Quality Gates in this workflow."
          fi
          echo "require_quality=$require_quality" >> "$GITHUB_OUTPUT"

  quality:
    name: Shared Quality Gates
    needs: prepare
    if: ${{ needs.prepare.outputs.require_quality == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout target
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.target_sha }}

      - name: Setup release environment
        uses: ./.github/actions/setup-release-env
        with:
          node-version: ${{ env.NODE_VERSION }}
          verify-electron: 'false'
          apt-packages: poppler-utils
          pip-packages: Pillow==11.3.0
          needs-playwright-chromium: 'true'
          rust-targets: wasm32-unknown-unknown

      - name: Release checks
        env:
          EVB_NATIVE_TOOLS_ALLOW_HOST_CI_GEN: '1'
        run: pnpm run release:verify:checks

  build_artifacts:
    name: Package Release Artifacts
    needs:
      - prepare
      - quality
    # Quality is skipped when exact-SHA push CI already vouched for the
    # commit; only a failed quality run blocks the builds.
    if: ${{ !cancelled() && needs.prepare.result == 'success' && needs.quality.result != 'failure' && needs.quality.result != 'cancelled' }}
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ needs.prepare.outputs.target_sha }}
      sentry_environment: test
      send_sentry_canaries: ${{ github.event_name == 'workflow_dispatch' && inputs.send_sentry_canaries || false }}
    secrets:
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_VERIFICATION_TOKEN: ${{ secrets.SENTRY_VERIFICATION_TOKEN }}
      SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
      SENTRY_DESKTOP_PROJECT: ${{ secrets.SENTRY_DESKTOP_PROJECT }}
      SENTRY_DESKTOP_DSN: ${{ secrets.SENTRY_DESKTOP_DSN }}

  build_win_arm64:
    name: Package Supplemental Windows ARM64 Assets
    needs:
      - prepare
      - quality
    if: ${{ !cancelled() && needs.prepare.result == 'success' && needs.quality.result != 'failure' && needs.quality.result != 'cancelled' }}
    uses: ./.github/workflows/build-target.yml
    with:
      ref: ${{ needs.prepare.outputs.target_sha }}
      sentry_environment: test
      send_sentry_canaries: ${{ github.event_name == 'workflow_dispatch' && inputs.send_sentry_canaries || false }}
      os: windows-11-arm
      platform: win
      arch: arm64
      artifact_group: supplemental-win-arm64
    secrets:
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_VERIFICATION_TOKEN: ${{ secrets.SENTRY_VERIFICATION_TOKEN }}
      SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
      SENTRY_DESKTOP_PROJECT: ${{ secrets.SENTRY_DESKTOP_PROJECT }}
      SENTRY_DESKTOP_DSN: ${{ secrets.SENTRY_DESKTOP_DSN }}

  build_mac_intel:
    name: Package Release Artifacts / build (macos-15-intel, mac, x64)
    needs:
      - prepare
      - quality
    if: ${{ !cancelled() && needs.prepare.result == 'success' && needs.quality.result != 'failure' && needs.quality.result != 'cancelled' }}
    uses: ./.github/workflows/build-mac-intel.yml
    with:
      ref: ${{ needs.prepare.outputs.target_sha }}
      sentry_environment: test
      send_sentry_canaries: ${{ github.event_name == 'workflow_dispatch' && inputs.send_sentry_canaries || false }}
    secrets:
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_VERIFICATION_TOKEN: ${{ secrets.SENTRY_VERIFICATION_TOKEN }}
      SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
      SENTRY_DESKTOP_PROJECT: ${{ secrets.SENTRY_DESKTOP_PROJECT }}
      SENTRY_DESKTOP_DSN: ${{ secrets.SENTRY_DESKTOP_DSN }}

  build_store:
    name: Package Microsoft Store AppX
    needs:
      - prepare
      - quality
    if: ${{ !cancelled() && needs.prepare.result == 'success' && needs.quality.result != 'failure' && needs.quality.result != 'cancelled' }}
    uses: ./.github/workflows/store-appx.yml
    with:
      ref: ${{ needs.prepare.outputs.target_sha }}
      sentry_environment: test
      send_sentry_canaries: ${{ github.event_name == 'workflow_dispatch' && inputs.send_sentry_canaries || false }}
    secrets:
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_VERIFICATION_TOKEN: ${{ secrets.SENTRY_VERIFICATION_TOKEN }}
      SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
      SENTRY_DESKTOP_PROJECT: ${{ secrets.SENTRY_DESKTOP_PROJECT }}
      SENTRY_DESKTOP_DSN: ${{ secrets.SENTRY_DESKTOP_DSN }}

  summarize:
    name: Summarize Artifact Downloads
    needs:
      - prepare
      - build_artifacts
      - build_win_arm64
      - build_mac_intel
      - build_store
    if: ${{ always() && needs.prepare.result == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Write artifact summary
        shell: bash
        env:
          ARTIFACTS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}#artifacts
          BUILD_ARTIFACTS_RESULT: ${{ needs.build_artifacts.result }}
          BUILD_WIN_ARM64_RESULT: ${{ needs.build_win_arm64.result }}
          BUILD_MAC_INTEL_RESULT: ${{ needs.build_mac_intel.result }}
          BUILD_STORE_RESULT: ${{ needs.build_store.result }}
          TARGET_SHA: ${{ needs.prepare.outputs.target_sha }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail

          {
            echo "## Release artifact build"
            echo
            echo "- Version: \`$VERSION\`"
            echo "- Commit: \`$TARGET_SHA\`"
            echo "- Artifacts: $ARTIFACTS_URL"
            echo
            echo "### Expected artifact groups"
            echo
            echo "- \`dist-mac-arm64\` ($BUILD_ARTIFACTS_RESULT)"
            echo "- \`dist-linux-x64\` ($BUILD_ARTIFACTS_RESULT)"
            echo "- \`dist-linux-arm64\` ($BUILD_ARTIFACTS_RESULT)"
            echo "- \`dist-win-x64\` ($BUILD_ARTIFACTS_RESULT)"
            echo "- \`supplemental-win-arm64\` ($BUILD_WIN_ARM64_RESULT)"
            echo "- \`supplemental-mac-x64\` ($BUILD_MAC_INTEL_RESULT)"
            echo "- \`store-appx-win-x64\` ($BUILD_STORE_RESULT)"
            echo "- \`store-appx-win-arm64\` ($BUILD_STORE_RESULT)"
          } >> "$GITHUB_STEP_SUMMARY"
