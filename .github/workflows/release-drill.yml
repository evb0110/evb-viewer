name: Publish-chain drill
run-name: Publish-chain drill ${{ github.run_id }}

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/release*.yml'
      - '.github/workflows/publish-chain.yml'
      - '.github/workflows/build-target.yml'
      - '.github/workflows/build*.yml'
      - '.github/workflows/store-appx.yml'
      - 'scripts/release/**'

concurrency:
  group: release-drill
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: '24.11.1'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  seed:
    name: Seed drill release
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup release environment
        uses: ./.github/actions/setup-release-env
        with:
          node-version: ${{ env.NODE_VERSION }}
          install-dependencies: 'false'

      - name: Install release helper dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Remove stale drill drafts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          cutoff="$(date -u -d '24 hours ago' +%s)"
          gh release list --limit 100 --json isDraft,tagName,createdAt |
            jq -r --arg cutoff "$cutoff" '
              .[]
              | select(.isDraft == true)
              | select((.tagName // "") | startswith("v0.0.0-drill."))
              | select((.createdAt | fromdateiso8601) < ($cutoff | tonumber))
              | .tagName
            ' |
            while IFS= read -r stale_tag; do
              if [ -n "$stale_tag" ]; then
                echo "Deleting stale drill draft $stale_tag"
                gh release delete "$stale_tag" --yes
              fi
            done

      - name: Generate deterministic core drill assets
        env:
          DRILL_VERSION: 0.0.0-drill.${{ github.run_id }}
          DRILL_ROOT: ${{ runner.temp }}/drill-assets
        run: node scripts/release/make-drill-release-assets.mjs "$DRILL_ROOT" "$DRILL_VERSION"

      - name: Upload macOS ARM64 drill artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: drill-dist-mac-arm64
          path: ${{ runner.temp }}/drill-assets/dist-mac-arm64/**
          if-no-files-found: error

      - name: Upload Linux x64 drill artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: drill-dist-linux-x64
          path: ${{ runner.temp }}/drill-assets/dist-linux-x64/**
          if-no-files-found: error

      - name: Upload Linux ARM64 drill artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: drill-dist-linux-arm64
          path: ${{ runner.temp }}/drill-assets/dist-linux-arm64/**
          if-no-files-found: error

      - name: Upload Windows x64 drill artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: drill-dist-win-x64
          path: ${{ runner.temp }}/drill-assets/dist-win-x64/**
          if-no-files-found: error

      - name: Create drill supplemental stubs
        env:
          DRILL_VERSION: 0.0.0-drill.${{ github.run_id }}
          DRILL_ROOT: ${{ runner.temp }}/drill-supplemental
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$DRILL_ROOT/mac" "$DRILL_ROOT/win"
          printf 'publish-chain drill Intel ZIP for %s\n' "$DRILL_VERSION" > "$DRILL_ROOT/mac/EVB-Viewer-${DRILL_VERSION}-x64.zip"
          printf 'publish-chain drill Windows ARM64 installer for %s\n' "$DRILL_VERSION" > "$DRILL_ROOT/win/EVB-Viewer-${DRILL_VERSION}-arm64-setup.exe"
          printf '{"kind":"drill","version":"%s","arch":"arm64"}\n' "$DRILL_VERSION" > "$DRILL_ROOT/win/EVB-Viewer-${DRILL_VERSION}-win-arm64-provenance.json"

          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import { readFileSync, writeFileSync } from 'node:fs';
          import { join } from 'node:path';
          const directory = join(process.env.DRILL_ROOT, 'win');
          const name = `EVB-Viewer-${process.env.DRILL_VERSION}-arm64-setup.exe`;
          const bytes = readFileSync(join(directory, name));
          const sha512 = createHash('sha512').update(bytes).digest('base64');
          writeFileSync(join(directory, `${name}.blockmap`), 'drill blockmap');
          writeFileSync(join(directory, 'latest-win-arm64.yml'), [
            `version: ${process.env.DRILL_VERSION}`,
            'files:', `  - url: ${name}`, `    sha512: ${sha512}`, `    size: ${bytes.length}`,
            `path: ${name}`, `sha512: ${sha512}`, '',
          ].join('\n'));
          NODE

      - name: Upload drill Intel stub
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: supplemental-drill-mac-x64
          path: ${{ runner.temp }}/drill-supplemental/mac/**
          if-no-files-found: error

      - name: Upload drill Windows ARM64 stubs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: supplemental-drill-win-arm64
          path: ${{ runner.temp }}/drill-supplemental/win/**
          if-no-files-found: error

      - name: Create draft drill release with the core asset set
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DRILL_TAG: v0.0.0-drill.${{ github.run_id }}
          DRILL_ROOT: ${{ runner.temp }}/drill-assets
        shell: bash
        run: |
          set -euo pipefail
          # Mirrors release.yml's publish job, which stages every core asset on
          # the draft before the chain finalizes checksums and mirrors it.
          mapfile -t core_assets < <(find "$DRILL_ROOT" -mindepth 2 -type f | sort)
          if [ "${#core_assets[@]}" -eq 0 ]; then
            echo '::error::No drill core assets were generated.'
            exit 1
          fi
          gh release create "$DRILL_TAG" "${core_assets[@]}" --draft --prerelease --notes "publish-chain drill"

  chain:
    name: Run publish chain in drill mode
    needs: seed
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/publish-chain.yml
    with:
      tag: v0.0.0-drill.${{ github.run_id }}
      workflow_sha: ${{ github.sha }}
      artifact_name_prefix: drill-dist-
      drill: true
      mirror_prefix: evb-viewer/drill/${{ github.run_id }}/releases/
      channel_key: evb-viewer/drill/${{ github.run_id }}/channels/stable.json
    secrets: inherit

  # The supplemental mirror copies land beside the core objects the chain
  # stages, so the drill runs the lanes in the order a real release does.
  supplemental_drill:
    name: Run supplemental attachment drill
    needs:
      - seed
      - chain
    permissions:
      actions: read
      attestations: write
      contents: write
      id-token: write
    uses: ./.github/workflows/release-supplemental.yml
    with:
      tag: v0.0.0-drill.${{ github.run_id }}
      workflow_sha: ${{ github.sha }}
      drill: true
      mirror_prefix: evb-viewer/drill/${{ github.run_id }}/releases/
      channel_key: evb-viewer/drill/${{ github.run_id }}/channels/stable.json
    secrets: inherit

  # A second pass against the same draft proves that a re-dispatch verifies
  # the assets already attached instead of rebuilding and re-uploading them.
  supplemental_redispatch_drill:
    name: Run supplemental attachment drill again
    needs: supplemental_drill
    permissions:
      actions: read
      attestations: write
      contents: write
      id-token: write
    uses: ./.github/workflows/release-supplemental.yml
    with:
      tag: v0.0.0-drill.${{ github.run_id }}
      workflow_sha: ${{ github.sha }}
      drill: true
      mirror_prefix: evb-viewer/drill/${{ github.run_id }}/releases/
      channel_key: evb-viewer/drill/${{ github.run_id }}/channels/stable.json
    secrets: inherit

  cleanup:
    name: Clean up drill state
    needs:
      - seed
      - chain
      - supplemental_drill
      - supplemental_redispatch_drill
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup release environment
        uses: ./.github/actions/setup-release-env
        with:
          node-version: ${{ env.NODE_VERSION }}
          install-dependencies: 'false'

      - name: Install mirror publisher dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Delete draft release and drill mirror objects
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DRILL_TAG: v0.0.0-drill.${{ github.run_id }}
          DRILL_PREFIX: evb-viewer/drill/${{ github.run_id }}/
          MIRROR_S3_ENDPOINT: ${{ secrets.MIRROR_S3_ENDPOINT }}
          MIRROR_S3_BUCKET: ${{ secrets.MIRROR_S3_BUCKET }}
          MIRROR_S3_ACCESS_KEY_ID: ${{ secrets.MIRROR_S3_ACCESS_KEY_ID }}
          MIRROR_S3_SECRET_KEY: ${{ secrets.MIRROR_S3_SECRET_KEY }}
        shell: bash
        run: |
          set -u
          cleanup_status=0
          release_view_error="$RUNNER_TEMP/drill-release-view-error.txt"
          if gh release view "$DRILL_TAG" --json isDraft > /dev/null 2> "$release_view_error"; then
            if ! gh release delete "$DRILL_TAG" --yes; then
              echo '::error::Failed to delete the drill draft release.'
              cleanup_status=1
            fi
          elif ! grep -Eqi 'not found|does not exist|could not find|HTTP 404' "$release_view_error"; then
            cat "$release_view_error" >&2
            echo '::error::Could not determine whether the drill draft release exists.'
            cleanup_status=1
          fi
          if ! node scripts/release/publish-release-mirror.mjs cleanup "$DRILL_PREFIX"; then
            echo '::error::Failed to clean the drill mirror prefix.'
            cleanup_status=1
          fi
          exit "$cleanup_status"
