appId: com.evb.viewer
productName: EVB Viewer
copyright: Copyright © 2026 Eugene Barsky
extends: ./.tmp/generated-electron-builder-resources.yml

# Keep the built Nuxt renderer as static assets. Electron backend behavior lives
# in main/preload plus typed IPC; packaged apps do not ship or spawn Nitro.
# Main, preload, and all workers are fully esbuild-bundled
# (scripts/build-electron.mjs). The image fallback has one staged N-API package
# and its target binding under dist-electron/runtime.
# Worker entry files that require direct filesystem paths are unpacked, together
# with the pdfjs fallback worker they dynamically import and the package.json
# that pins dist-electron/*.js to ESM semantics.
asar: true
asarUnpack:
  - dist-electron/package.json
  - dist-electron/djvu-pdfWorker.js
  - dist-electron/document-save-utility.js
  - dist-electron/image-export-tiff-worker.js
  - dist-electron/ocr-worker.js
  - dist-electron/page-ops-cropWorker.js
  - dist-electron/pdf.worker.mjs
  - dist-electron/runtime/@napi-rs/canvas/*.node
  - dist-electron/pdfCombineWorker.js
  - dist-electron/pdfConformanceWorker.js
  - dist-electron/pdf-print-layout-utility.js
  - dist-electron/search-worker.js
  - dist-electron/scan-cleanup-worker.js
npmRebuild: false
afterPack: ./scripts/afterPack.cjs
afterSign: ./scripts/afterSign.cjs

directories:
  # Keep desktop release artifacts out of top-level dist/ so Vercel does not
  # mistake Electron packages for web output.
  output: release

files:
  - dist-electron/
  - nuxt-output/public/
  - package.json
  - scripts/evb-mcp-proxy.mjs
  # Runtime dependencies are otherwise bundled or web-only. The canvas fallback
  # is staged below dist-electron by scripts/build-electron.mjs.
  - "!node_modules/**"
  - dist-electron/runtime/@napi-rs/**
  - "!nuxt-output/**/*.map"
  - "!dist-electron/**/*.map"
  - "!dist-electron/**/*.meta.json"
  # Web-only marketing/SEO surface — unreachable from the desktop shell.
  - "!nuxt-output/public/evb-viewer-seo.png"
  - "!nuxt-output/public/evb-viewer-preview-cropped.png"
  - "!nuxt-output/public/evb-viewer-og.png"
  - "!nuxt-output/public/mobile-reader-proof/**"
  - "!nuxt-output/public/robots.txt"
  - "!nuxt-output/public/sitemap.xml"
  - "!.devkit/**/*"
  - "!.devkit"

mac:
  icon: resources/icon.icns
  artifactName: "EVB-Viewer-${version}-${arch}.${ext}"
  entitlementsInherit: build/entitlements.mac.plist
  # Built-in notarization is disabled ON PURPOSE: electron-builder runs it BEFORE
  # the afterSign hook re-signs the bundled native tools, which changes the app's
  # code hash and orphans the notarization ticket (ships as "Unnotarized Developer
  # ID"). Instead, afterSign.cjs notarizes + staples the app as its final step,
  # after all re-signing, so the notarized hash matches the shipped app and both
  # the DMG and the auto-update ZIP contain a stapled bundle. Credentials come from
  # env: APPLE_API_KEY (.p8 path), APPLE_API_KEY_ID, APPLE_API_ISSUER.
  notarize: false
  target:
    - dmg
    - zip
  # Native tools are staged through the generated resource manifest, then afterPack moves the
  # executable payloads under Contents/MacOS/native-tools. macOS kills Mach-O
  # launches from Contents/Resources inside .app bundles on current hosts.
  # afterSign re-signs the moved payloads with the app identity so bundled
  # dylibs loaded by those executables pass library validation.

win:
  icon: resources/icon.ico
  artifactName: "EVB-Viewer-${version}-${arch}-setup.${ext}"
  # Keep non-differential Windows archives uncompressed. The afterPack hook
  # forces BCJ for differential NSIS archives because electron-builder 26.15.x
  # overrides this setting with normal compression for those archives.
  compression: store
  target:
    - nsis

appx:
  artifactName: "EVB-Viewer-${version}-${arch}-store.${ext}"
  applicationId: EVBViewer
  identityName: EugeneBarsky.EVBViewer
  publisher: CN=06251AF5-66AF-420F-B896-574B507600B9
  publisherDisplayName: Eugene Barsky
  displayName: EVB Viewer
  languages:
    - en-US
    - ru-RU
    - fr-FR
    - de-DE
    - es-ES
    - it-IT
    - pt-PT
    - pt-BR
    - nl-NL
  capabilities:
    - runFullTrust

linux:
  icon: resources/icon.png
  # GitHub release asset labels normalize spaces to dots. Keep Linux artifact
  # names stable and verification-safe before they cross that API boundary.
  artifactName: "EVB-Viewer-${version}-${arch}.${ext}"
  maintainer: Eugene Barsky <34789976+evb0110@users.noreply.github.com>
  vendor: Eugene Barsky
  synopsis: PDF and DjVu document viewer
  description: EVB Viewer is a desktop document viewer for PDF and DjVu files with OCR, annotations, page operations, export tools, and multi-tab viewing.
  category: Office
  desktop:
    entry:
      Keywords: PDF;DjVu;Document;Viewer;OCR;
      X-AppStream-DeveloperName: Eugene Barsky
  target:
    - AppImage
    - deb
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  include: build/installer.nsh

fileAssociations:
  - ext: pdf
    mimeType: application/pdf
    role: Viewer
  - ext: djvu
    mimeType: image/vnd.djvu
    role: Viewer
  - ext: djv
    mimeType: image/vnd.djvu
    role: Viewer

dmg:
  # Generated by scripts/generate-dmg-background.mjs; the @2x sibling is merged
  # into a HiDPI TIFF automatically. dmg-builder ignores dmg.window when a
  # background is set — the Finder window size comes from the 1x image (600x450),
  # so keep the image geometry and the icon coordinates below in sync.
  background: resources/dmg-background.png
  icon: null
  iconSize: 128
  contents:
    - x: 160
      y: 185
    - x: 440
      y: 185
      type: link
      path: /Applications

publish:
  provider: github
  owner: evb0110
  repo: evb-viewer
